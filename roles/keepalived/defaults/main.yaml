---
# Default variables for the keepalived role.
#
# Most host-identifying and pool-wide values below have no default and
# MUST be supplied per host via host_vars, or per group via group_vars —
# see the "Required, no default" section at the bottom of this file for
# the full list.

# Health check script deployed to the target and called by keepalived's
# vrrp_script (self-check) and, when load balancing is enabled, IPVS
# MISC_CHECK (per-real-server checks). keepalived_check_script is both the
# destination path and (via | basename) the template filename in
# templates/ — keep the two in sync if you rename either.
keepalived_check_script: /etc/keepalived/scripts/check.sh
keepalived_check_interval: 3
keepalived_check_fall: 2
keepalived_check_rise: 2
# Also used inside keepalived_check_command (defined per group) as the
# request timeout, so this one value governs both keepalived's own script
# timeout and how long the health check itself waits for a response.
keepalived_check_timeout: 2

# Notify script deployed to the target and called by keepalived on every
# VRRP state transition (MASTER/BACKUP/FAULT). Logs the current state to a
# status file under keepalived_run_dir.
keepalived_notify_script: /etc/keepalived/scripts/notify.sh

# Status directory the notify script writes into. Lives under /run (tmpfs),
# so a systemd-tmpfiles rule recreates it on every boot — see tasks/main.yaml.
keepalived_run_dir: /run/keepalived-scripts

# ---------------------------------------------------------------------------
# IPVS load balancing (optional) — off by default. When enabled, whichever
# node currently holds the VIP also acts as an IPVS director, distributing
# VIP traffic across keepalived_real_servers using LVS-DR mode (the real
# server answers the client directly, preserving the real source IP - no
# proxying). Each real server needs the VIP bound to its own loopback
# interface with ARP suppressed; tasks/main.yaml handles both when this is
# enabled. Typically set at the group level (group_vars), not per-host,
# since the pool definition is the same on every director in the pool.
keepalived_load_balancer_enabled: false
keepalived_lb_algo: wrr          # weighted round robin
keepalived_lb_kind: DR           # direct routing - preserves client source IP
keepalived_lb_port: 53
keepalived_lb_protocols:
  - UDP
  - TCP
# Firewall mark numbers used by both the fwmark-based virtual_server blocks
# in keepalived.conf.j2 and the iptables mangle rules (tasks/main.yaml)
# that mark genuinely-new client traffic before it reaches them. Both
# consumers must agree on these values - defined once here so they can't
# drift apart.
keepalived_lb_fwmark_udp: 1
keepalived_lb_fwmark_tcp: 2
# Script that applies the iptables mangle rules preventing the dual-director
# ping-pong loop (see keepalived.conf.j2's comment block for the full
# explanation). Deployed and re-applied at every boot via a small systemd
# oneshot unit - see tasks/main.yaml.
keepalived_mangle_script: /etc/keepalived/scripts/mangle-rules.sh
keepalived_real_servers: []
  # - ip: 10.24.19.30
  #   weight: 10

# ---------------------------------------------------------------------------
# Required, no default — must be set per host in host_vars, or per group in
# group_vars, since these are host-identifying or secret values:
#
#   keepalived_instance_name     - unique VRRP instance name for this host
#   keepalived_state             - BACKUP (recommended for all nodes; priority
#                                  decides the initial MASTER, not this field)
#   keepalived_priority          - VRRP election priority (higher wins)
#   keepalived_interface         - network interface to run VRRP on
#   keepalived_unicast_src_ip    - this host's own IP/CIDR
#   keepalived_unicast_peers     - list of the other node(s)' IP/CIDR
#   keepalived_vip               - shared virtual IP/CIDR, same on every node
#   keepalived_virtual_router_id - VRRP router ID, unique per broadcast domain
#   keepalived_auth_pass         - shared VRRP auth password (vault-encrypted)
#   keepalived_check_command     - full check command; must reference ${TARGET}
#                                  (and ${TOKEN}, if the check needs auth -
#                                  the default Technitium API check does)
#   keepalived_technitium_api_token - this node's own Technitium API token,
#                                  vault-encrypted (host_vars). Required
#                                  whenever keepalived_check_command
#                                  references ${TOKEN} - the default does.
#   keepalived_inventory_group   - inventory group name containing every
#                                  node in this VRRP pool (only required
#                                  when keepalived_load_balancer_enabled is
#                                  true - used to derive peer MAC addresses
#                                  and API tokens for the mangle rules /
#                                  MISC_CHECK)
#   admin_user / admin_group     - account that owns/executes the deployed
#                                  scripts (see group_vars/all/admin-user.yaml)
# ---------------------------------------------------------------------------
