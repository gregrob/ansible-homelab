---
# Role to configure keepalived for VRRP-based VIP failover between two or
# more hosts, with a service health check driving failover and a notify
# script recording state transitions. Optionally also configures IPVS load
# balancing (LVS-DR mode) across a pool of real servers, active only when
# keepalived_load_balancer_enabled is true.
#
# Steps performed:
#  1. Installs keepalived (and, if load balancing is enabled, ipvsadm +
#     the ip_vs kernel module)
#  2. If load balancing is enabled: configures the ARP/forwarding sysctls
#     and binds the VIP to loopback, both required for LVS-DR real servers
#  3. Deploys a systemd-tmpfiles rule for the notify script's status
#     directory under /run, so it's recreated automatically on every boot
#     (plain directories under /run don't survive a reboot on their own)
#  4. Deploys the health check script, used both by vrrp_script (self-check)
#     and, when load balancing is enabled, IPVS MISC_CHECK (per-real-server
#     checks) — command is set via keepalived_check_command, so the same
#     role works for any service, not just DNS
#  5. Deploys the notify script that logs VRRP state transitions
#     (MASTER/BACKUP/FAULT) to a status file
#  6. Templates keepalived.conf from host-specific vars (including the IPVS
#     virtual_server/real_server blocks, if enabled) and restarts the
#     service when it changes
#  7. Ensures keepalived is enabled and running

# Install the keepalived package
- name: Install keepalived
  apt:
    name: keepalived
    state: present
    update_cache: true

# --- IPVS load balancing setup (only when enabled) -------------------------

# ipvsadm isn't strictly required for keepalived to manage IPVS itself, but
# it's the standard tool for inspecting IPVS state by hand when troubleshooting
- name: Install ipvsadm for IPVS inspection/troubleshooting
  apt:
    name: ipvsadm
    state: present
  when: keepalived_load_balancer_enabled | bool

# ip_vs is the kernel module IPVS is built on; load it now and persist it
# so it's loaded again automatically on every future boot
#- name: Ensure ip_vs kernel module is loaded
#  modprobe:
#    name: ip_vs
#    state: present
#  when: keepalived_load_balancer_enabled | bool

#- name: Persist ip_vs module load at boot
#  copy:
#    dest: /etc/modules-load.d/keepalived-ipvs.conf
#    content: "ip_vs\n"
#    owner: root
#    group: root
#    mode: '0644'
#  when: keepalived_load_balancer_enabled | bool

# LVS-DR mode requires each real server to not answer ARP for the VIP
# (arp_ignore/arp_announce), so incoming packets addressed to the VIP are
# accepted locally rather than the node broadcasting itself as the VIP's
# owner. ip_forward is NOT required for DR mode (only NAT mode needs it) —
# deliberately left out.
- name: Deploy sysctl config for IPVS real server ARP behavior
  copy:
    dest: /etc/sysctl.d/99-keepalived-lb.conf
    content: |
      net.ipv4.conf.all.arp_ignore = 1
      net.ipv4.conf.all.arp_announce = 2
    owner: root
    group: root
    mode: '0644'
  when: keepalived_load_balancer_enabled | bool
  register: keepalived_lb_sysctl

- name: Apply sysctl settings now
  command: sysctl --system
  when: keepalived_lb_sysctl.changed

# Each real server binds the VIP to its own loopback interface so it can
# accept and answer VIP traffic directly (the whole point of DR mode - the
# client sees a reply from the VIP, not from this node's real IP), without
# this node ever announcing itself as the VIP's owner via ARP
- name: Deploy loopback VIP binding service (IPVS DR mode)
  template:
    src: keepalived-lb-loopback.service.j2
    dest: /etc/systemd/system/keepalived-lb-loopback.service
    owner: root
    group: root
    mode: '0644'
  when: keepalived_load_balancer_enabled | bool
  register: keepalived_lb_loopback_unit

- name: Reload systemd daemon if loopback service changed
  systemd:
    daemon_reload: true
  when: keepalived_lb_loopback_unit.changed

- name: Enable and start loopback VIP binding service
  systemd:
    name: keepalived-lb-loopback
    enabled: true
    state: started
  when: keepalived_load_balancer_enabled | bool

# --- Health check + notify scripts (used regardless of load balancing) -----

# /run is tmpfs and is wiped on every reboot, so the notify script's status
# directory needs a tmpfiles.d rule to be recreated automatically at boot
# rather than relying on this playbook having been run since the last reboot
- name: Deploy tmpfiles.d rule for keepalived-scripts run directory
  copy:
    content: "d {{ keepalived_run_dir }} 0755 {{ admin_user }} {{ admin_group }} -\n"
    dest: /etc/tmpfiles.d/keepalived-scripts.conf
    owner: root
    group: root
    mode: '0644'
  register: keepalived_tmpfiles

# Apply the tmpfiles rule immediately so the directory exists right now,
# without waiting for the next reboot
- name: Apply tmpfiles rule now (so it exists without waiting for reboot)
  command: "systemd-tmpfiles --create /etc/tmpfiles.d/keepalived-scripts.conf"
  when: keepalived_tmpfiles.changed

# Ensure the health check script's destination directory exists before
# deploying the script into it
- name: Ensure check script destination directory exists
  file:
    path: "{{ keepalived_check_script | dirname }}"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_group }}"
    mode: '0755'

# Deploy the health check script. This is a real script file (not an inline
# command in keepalived.conf) because enable_script_security causes
# keepalived to exec the command directly rather than via a shell — an
# inline pipe (e.g. "dig ... | grep ...") would have its pipe symbol passed
# as a literal argument instead of being interpreted, silently breaking the
# check. Wrapping it in a script file with its own shebang avoids this.
# The same script is reused for IPVS MISC_CHECK by passing a target IP as
# an argument (see keepalived.conf.j2) — exec'ing "script path" + "one
# argument" needs no shell interpretation, so this remains safe under
# enable_script_security either way.
- name: Deploy health check script
  template:
    src: "{{ keepalived_check_script | basename }}.j2"
    dest: "{{ keepalived_check_script }}"
    owner: "{{ admin_user }}"
    group: "{{ admin_group }}"
    mode: '0755'

# Ensure the notify script's destination directory exists before deploying
# the script into it
- name: Ensure notify script destination directory exists
  file:
    path: "{{ keepalived_notify_script | dirname }}"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_group }}"
    mode: '0755'

# Deploy the notify script. keepalived calls this on every VRRP state
# transition (MASTER/BACKUP/FAULT); it just logs the current state to a
# status file under keepalived_run_dir for observability
- name: Deploy notify script
  template:
    src: "{{ keepalived_notify_script | basename }}.j2"
    dest: "{{ keepalived_notify_script }}"
    owner: "{{ admin_user }}"
    group: "{{ admin_group }}"
    mode: '0755'

# --- keepalived config + service --------------------------------------------

# Template keepalived.conf from host-specific vars (interface, priority,
# VIP, peers, etc.) - and, if load balancing is enabled, the IPVS
# virtual_server/real_server blocks - restarting the service only if the
# rendered content actually changed
- name: Deploy keepalived.conf
  template:
    src: keepalived.conf.j2
    dest: /etc/keepalived/keepalived.conf
    owner: root
    group: root
    mode: '0640'
  notify: restart keepalived

# Ensure keepalived is enabled at boot and currently running
- name: Ensure keepalived is enabled and running
  systemd:
    name: keepalived
    enabled: true
    state: started
