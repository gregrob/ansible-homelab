---
# ==============================================================================
# Role: homelab_nav
# Description:
#   Deploys a system-wide shell shortcut ('cdh') and interactive tab completion
#   for navigating homelab and container directories.
#
# Functionality & Usage:
#   - 'cdh'              -> Jumps to host's base docker target directory.
#   - 'cdh <container>'  -> Jumps directly to <dest>/servers/<hostname>/<container>
#   - 'cdh [TAB][TAB]'   -> Auto-completes available container directory names.
# ==============================================================================

# Look through the github_repos list (defined in group_vars) and pull out 
# the 'dest' path specifically for 'docker-homelab'. 
# If the repo isn't in the list for this host, it returns an empty string.
- name: Extract docker-homelab destination path
  ansible.builtin.set_fact:
    docker_homelab_dest: "{{ (github_repos | default([]) | selectattr('name', 'equalto', 'docker-homelab') | map(attribute='dest') | first) | default('') }}"

# Deploy the bash completion script to the system-wide completion directory.
# We use the 'when' clause to ensure this only runs on nodes that actually
# have the docker-homelab repo configured.
- name: Deploy cdh tab completion script
  ansible.builtin.template:
    src: cdh_completion.j2
    dest: /etc/bash_completion.d/cdh
    owner: root
    group: root
    mode: '0644'
  when: docker_homelab_dest != ''

# Deploy the shell function to the system-wide profile directory so 
# it loads automatically for all users upon login.
- name: Deploy cdh shell function system-wide
  ansible.builtin.template:
    src: cdh_function.j2
    dest: /etc/profile.d/cdh.sh
    owner: root
    group: root
    mode: '0644'
  when: docker_homelab_dest != ''
  