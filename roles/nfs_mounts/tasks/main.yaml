---
# Role to configure NFS mounts on the target system.
#
# Steps performed:
#  1. Displays NFS configuration requirements for the user
#  2. Lists required NFS shares that should be exported on the NAS
#  3. Checks if mount points are already mounted to avoid redundant operations
#  4. Creates local mount point directories for each NFS share (only if not mounted)
#  5. Sets mount points immutable to prevent writes to local filesystem when NFS is unavailable
#  6. Adds/updates NFS mount entries to /etc/fstab (regardless of current mount state)
#  7. Mounts NFS shares if not already mounted (with error tolerance)
#
# NOTE ON mount_in_guest:
# Each nfs_mounts entry may set `mount_in_guest: true/false` to control
# whether THIS role actually mounts it inside the target host, rather
# than just documenting it as a requirement. If omitted, it defaults
# to `true` for VMs (unchanged existing behavior) and `false` for LXCs
# (unchanged existing behavior — reference-only unless a share opts in).
#
# Setting mount_in_guest: true on an LXC entry requires that container
# to be privileged with features: mount=nfs set on the Proxmox host,
# plus nfs-common installed in the guest (one-time manual prerequisite,
# see that host's wiki page).

# Display informational message about NFS share configuration requirements
- name: display NFS configuration requirements
  ansible.builtin.debug:
    msg:
      - "┌──────────────────────────────────────────────────────────────┐"
      - "│          NFS Share Configuration Required on NAS             │"
      - "│ Ensure the following shares are exported and the target host │"
      - "│ has been granted access in the NAS NFS permissions.          │"
      - "└──────────────────────────────────────────────────────────────┘"
      - "NAS Host  : {{ nfs_host }}"
      - "Client IP : {{ ansible_host }}"

# Display list of NFS shares that need to be exported with their access modes
- name: display required NFS shares
  ansible.builtin.debug:
    msg: "  {{ item.share }} [{{ item.mode | upper }}]{{ ' (guest-mounted)' if (item.get('mount_in_guest', target_type == 'vm') | bool) else ' (reference only)' }}"
  loop: "{{ nfs_mounts }}"
  loop_control:
    label: "{{ item.mountpoint }}"

# Check if each mount point is already mounted to avoid unnecessary operations
- name: check if mount points are already mounted
  ansible.builtin.command:
    cmd: "mountpoint -q {{ nfs_base_path }}/{{ item.mountpoint }}"
  register: mount_check
  loop: "{{ nfs_mounts }}"
  when: item.get('mount_in_guest', target_type == 'vm') | bool
  changed_when: false
  failed_when: false

# Create mount point directories only for shares that are not already mounted
- name: ensure NFS mount points exist
  ansible.builtin.file:
    path: "{{ nfs_base_path }}/{{ item.item.mountpoint }}"
    state: directory
    mode: '0755'
  loop: "{{ mount_check.results }}"
  when: item.rc is defined and item.rc != 0
  loop_control:
    label: "{{ nfs_base_path }}/{{ item.item.mountpoint }}"

# Set mount points immutable to prevent writes to local filesystem when NFS is unavailable
# NOTE: If the mount is already mounted, we have to skip otherwise it will fail
- name: set mount points immutable to prevent local writes
  ansible.builtin.command:
    cmd: "chattr +i {{ nfs_base_path }}/{{ item.item.mountpoint }}"
  loop: "{{ mount_check.results }}"
  when: item.rc is defined and item.rc != 0
  loop_control:
    label: "{{ nfs_base_path }}/{{ item.item.mountpoint }}"

# Update fstab entry regardless of mount state
- name: configure NFS mounts in fstab
  ansible.builtin.mount:
    path: "{{ nfs_base_path }}/{{ item.mountpoint }}"
    src: "{{ nfs_host }}:{{ item.share }}"
    fstype: nfs
    opts: "{{ nfs_common_opts }},{{ item.mode }}"
    boot: "{{ nfs_mount_boot }}"
    state: present
  loop: "{{ nfs_mounts }}"
  when: item.get('mount_in_guest', target_type == 'vm') | bool
  loop_control:
    label: "{{ nfs_host }}:{{ item.share }} → {{ nfs_base_path }}/{{ item.mountpoint }}"

# Mount if not already mounted
- name: mount NFS shares
  ansible.builtin.mount:
    path: "{{ nfs_base_path }}/{{ item.mountpoint }}"
    src: "{{ nfs_host }}:{{ item.share }}"
    fstype: nfs
    opts: "{{ nfs_common_opts }},{{ item.mode }}"
    boot: "{{ nfs_mount_boot }}"
    state: mounted
  loop: "{{ nfs_mounts }}"
  when: item.get('mount_in_guest', target_type == 'vm') | bool
  ignore_errors: true
  loop_control:
    label: "{{ nfs_host }}:{{ item.share }} → {{ nfs_base_path }}/{{ item.mountpoint }}"
