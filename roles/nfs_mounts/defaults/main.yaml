--- 
# Default variables for the nfs_mounts role

# NFS server hostname or IP address (uses nas_host from group_vars)
nfs_host: "{{ nas_host }}"

# Base path for NFS mount points on the client
nfs_base_path: /mnt

# Controls system startup behavior (boot parameter in ansible.builtin.mount).
# Set to 'false' because we use x-systemd.automount below.
#
# NOTE: Ansible automatically appends 'noauto' to /etc/fstab when boot is false.
# Do NOT add 'noauto' to nfs_common_opts below, or Ansible will append it twice 
# and trigger an idempotency loop on every run.
nfs_mount_boot: false

# Common NFS mount options applied to all shares
#
# Boot & systemd integration:
#   _netdev                 - wait for network stack before attempting mount
#   x-systemd.automount     - mount on first access; auto-reconnects if NAS reboots
#   x-systemd.idle-timeout=60 - auto-unmount after 60s of inactivity (clears stale mounts)
#   x-systemd.device-timeout=10 - fail fast (10s) at boot if NAS is completely unreachable
#
# Resilience (NAS rebooting / network drop):
#   soft                    - return I/O errors to app if server unreachable (prevents lockup)
#   timeo=30                - timeout after 3s (30 x 0.1s) before retrying
#   retrans=3               - retry 3 times before returning an error
#
# Performance:
#   noatime                 - do not write file access timestamps (reduces NAS disk I/O)
#   nfsvers=4               - force NFSv4 protocol
nfs_common_opts: "_netdev,noatime,nfsvers=4,soft,timeo=30,retrans=3,x-systemd.automount,x-systemd.idle-timeout=60,x-systemd.device-timeout=10"

# List of NFS shares to mount with their corresponding local mount points
nfs_mounts:
  - share: /volume1/media
    mountpoint: media
    mode: ro
  - share: /volume1/photo-library
    mountpoint: photo-library
    mode: ro
  - share: /volume1/video
    mountpoint: video
    mode: ro
  - share: /volume1/downloads
    mountpoint: downloads
    mode: rw
  - share: /volume1/server-mounts
    mountpoint: server-mounts
    mode: rw
