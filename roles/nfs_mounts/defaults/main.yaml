--- 
# Default variables for the nfs_mounts role

# NFS server hostname or IP address (uses nas_host from group_vars)
nfs_host: "{{ nas_host }}"

# Base path for NFS mount points on the client
nfs_base_path: /mnt

# Controls system startup behavior (boot parameter in ansible.builtin.mount).
# Set to 'true' — the mount is attempted at boot; if the NAS is unreachable,
# the 'bg' option below (not automount) handles retrying without blocking
# boot, so we want systemd to actually attempt the mount rather than defer
# it lazily.
nfs_mount_boot: true

# Common NFS mount options applied to all shares
#
# Boot & network:
#   _netdev   - wait for network stack before attempting mount
#   bg        - if the initial mount attempt fails (NAS unreachable), fork
#               and retry in the background rather than blocking boot;
#               once the NAS returns, the backgrounded attempt succeeds and
#               the mount just appears — no manual intervention needed.
#               Works identically inside both VMs and LXCs (unlike
#               x-systemd.automount, which systemd refuses to run inside
#               containers at all).
#
# Resilience & data integrity (NAS rebooting / network drop):
#   hard      - block and retry indefinitely rather than erroring out if the
#               NAS is unreachable mid-operation. Safer than 'soft' for
#               read-write shares: soft mounts can silently corrupt writes if
#               an app doesn't properly check the returned I/O error. A hard
#               mount only pauses the specific process touching this share
#               while the NAS is down — it does not lock up the host, and
#               resumes cleanly once the NAS returns.
#   timeo=30  - timeout (in tenths of a second: 3s) before each retry
#   retrans=3 - number of retries per request before considered failed
#               (irrelevant with 'hard', which retries indefinitely anyway,
#               but kept for clarity/consistency)
#
# Performance:
#   noatime   - do not write file access timestamps (reduces NAS disk I/O)
#   nfsvers=4 - force NFSv4 protocol
nfs_common_opts: "_netdev,noatime,nfsvers=4,hard,bg,timeo=30,retrans=3"

# List of NFS shares to mount with their corresponding local mount points
nfs_mounts:
  - share: /volume1/media
    mountpoint: media
    mode: ro
  - share: /volume1/photo-library
    mountpoint: photo-library
    mode: ro
  - share: /volume1/video
    mountpoint: video
    mode: ro
  - share: /volume1/downloads
    mountpoint: downloads
    mode: rw
  - share: /volume1/server-mounts
    mountpoint: server-mounts
    mode: rw
