---
# nut_server role entry point
#
# This file only decides what runs; the work is in the imported task files:
#   setup_nut_server.yml  upsd, upsmon and the UPS drivers (always runs)
#   setup_nut_web.yml     the NUT web interface: apache2 + nut-cgi
#                         (skipped when nut_server_web_enabled is false)
#
# import_tasks (static) is used rather than include_tasks so that the tags and
# --check behaviour apply to the imported tasks, and the playbook can run just
# one part:
#   --tags nut_server    server only
#   --tags nut_web       web interface only
#   --tags nut           both
# The playbook tags the role itself 'nut' only, so these two tags stay separate.

# =======================================================================
# NUT server (upsd, upsmon, drivers)
# =======================================================================
- name: Set up the NUT server
  ansible.builtin.import_tasks: setup_nut_server.yml
  tags: [nut_server]

# =======================================================================
# NUT web interface (apache2 + nut-cgi)
# =======================================================================
- name: Set up the NUT web interface
  ansible.builtin.import_tasks: setup_nut_web.yml
  when: nut_server_web_enabled | bool
  tags: [nut_web]
