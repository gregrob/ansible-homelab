---
# nut_server role defaults
#
# Everything overridable lives here (not group_vars) so role defaults sit at the
# right precedence level. Override per host/group in inventory or host_vars.
# Secrets (the *_password variables below) are supplied from the vault.

# =======================================================================
# Operating Mode
# =======================================================================
# netserver = this host talks to the UPS and serves data to remote clients
# standalone = this host talks to the UPS and only this host uses it
nut_server_mode: netserver

# =======================================================================
# UPS Definitions (rendered into ups.conf)
# =======================================================================
# name:    UPS identifier used by clients as <name>@<server>
# driver:  e.g. usbhid-ups, snmp-ups, dummy-ups
# port:    device path / "auto" for USB / SNMP host / .dev file path for dummy-ups
# desc:    free-text description
# options: extra driver settings; a value of `true` renders as a bare flag
#
# Example (real USB UPS):
#   - name: ups
#     driver: usbhid-ups
#     port: auto
#     desc: "Rack UPS"
#     options:
#       pollinterval: 2
#
# Example (testing with the dummy driver):
#   - name: dummy
#     driver: dummy-ups
#     port: /etc/nut/dummy.dev
#     desc: "Dummy test UPS"
nut_server_ups: []

# Global driver settings (ups.conf). A per-UPS option of the same name overrides these.
nut_server_pollinterval: 1   # seconds between UPS polls
nut_server_maxretry: 3       # comms retries before the UPS is marked stale

# =======================================================================
# Network
# =======================================================================
# Addresses upsd listens on. 127.0.0.1 is always added by the template when
# not covered, because this host's own upsmon and the role's verification
# connect to localhost.
nut_server_listen:
  - address: 0.0.0.0
    port: 3493

# =======================================================================
# Users (rendered into upsd.users)
# =======================================================================
# Passwords are REQUIRED and must come from your secrets mechanism, never
# committed in plaintext. The role asserts every user has a password.
#
# The first two names are also used by upsmon.conf (admin = local primary
# monitoring user) and by client hosts (observer = secondary, read-only).
nut_server_admin_user: admin
nut_server_admin_password: ""
nut_server_observer_user: observer
nut_server_observer_password: ""
nut_server_webadmin_password: ""
nut_server_hauser_password: ""

# Core users: present on every NUT server. Fields per user:
#   name, password
#   desc:     comment block rendered above the user (list of lines)
#   actions:  list of upsd actions (set, fsd)
#   instcmds: list of instant commands (all, or specific ones)
#   upsmon:   master | secondary (omit for non-upsmon users)
# Not intended to be overridden; add integrations via nut_server_extra_users.
nut_server_core_users:
  - name: "{{ nut_server_admin_user }}"
    password: "{{ nut_server_admin_password }}"
    desc:
      - UPS administrative and monitoring master user
      - This single user handles both administrative tasks and primary monitoring
    actions: [set, fsd]
    instcmds: [all]
    upsmon: master
  - name: "{{ nut_server_observer_user }}"
    password: "{{ nut_server_observer_password }}"
    desc:
      - Secondary monitoring user for other systems on the network
      - These systems monitor the UPS but have no control over it (no shutdown authority)
    upsmon: secondary
  - name: webadmin
    password: "{{ nut_server_webadmin_password }}"
    desc:
      - Web interface administrative user
      - For the NUT CGI web interface (upsstats.cgi, upsset.cgi, etc.)
    actions: [set]
    instcmds: [all]

# Extra users defined in host vars (same fields as the core users)
nut_server_extra_users: []

# Everything written to upsd.users (core first, then extras).
nut_server_users: "{{ nut_server_core_users + nut_server_extra_users }}"

# =======================================================================
# upsmon (local monitoring + shutdown behaviour of this server)
# =======================================================================
# Account upsmon runs as. The privileged parent process stays root regardless
# (it is what runs SHUTDOWNCMD); this only sets the unprivileged monitor child.
nut_server_run_as_user: nut

nut_server_minsupplies: 1
nut_server_shutdowncmd: /sbin/shutdown -h +0
nut_server_powerdownflag: /etc/killpower

# Timing (seconds)
nut_server_finaldelay: 175      # wait after the final shutdown notice before this host shuts down
nut_server_hostsync: 15         # how long the primary waits for secondaries to disconnect
nut_server_deadtime: 15         # mark UPS dead after this long with no communication
nut_server_pollfreq: 2          # poll UPS every N seconds
nut_server_pollfreqalert: 1     # poll every N seconds while on battery / in alert

# Warnings (seconds)
nut_server_rbwarntime: 43200    # nag about battery replacement every 12 hours
nut_server_nocommwarntime: 300  # warn about lost communication every 5 minutes

# =======================================================================
# Notifications
# =======================================================================
# Program upsmon runs for events whose flags include EXEC. Defaults to upssched
# when any callbacks are defined below, and to nothing otherwise.
nut_server_notifycmd: "{{ '/usr/sbin/upssched' if nut_server_upssched_callbacks | length > 0 else '' }}"

nut_server_notifymsg:
  ONLINE: "UPS %s on line power"
  ONBATT: "UPS %s on battery"
  LOWBATT: "UPS %s battery is low"
  FSD: "UPS %s: forced shutdown in progress"
  COMMOK: "Communications with UPS %s established"
  COMMBAD: "Communications with UPS %s lost"
  SHUTDOWN: "Auto logout and shutdown proceeding"
  REPLBATT: "UPS %s battery needs to be replaced"
  NOCOMM: "UPS %s is unavailable"
  NOPARENT: "upsmon parent process died - shutdown impossible"

nut_server_notifyflags:
  - { event: ONLINE, flags: SYSLOG+WALL+EXEC, comment: "Power restored" }
  - { event: ONBATT, flags: SYSLOG+WALL+EXEC, comment: "On battery" }
  - { event: LOWBATT, flags: SYSLOG+WALL, comment: "Low battery - log and display only" }
  - { event: FSD, flags: SYSLOG+WALL+EXEC, comment: "Forced shutdown" }
  - { event: COMMOK, flags: SYSLOG+WALL+EXEC, comment: "Communication restored" }
  - { event: COMMBAD, flags: SYSLOG+WALL+EXEC, comment: "Communication lost" }
  - { event: SHUTDOWN, flags: SYSLOG+WALL+EXEC, comment: "System shutdown" }
  - { event: REPLBATT, flags: SYSLOG+WALL+EXEC, comment: "Replace battery" }
  - { event: NOCOMM, flags: SYSLOG+WALL+EXEC, comment: "No communication" }
  - { event: NOPARENT, flags: SYSLOG+WALL, comment: "Parent died - log only (system unstable)" }

# =======================================================================
# Web Interface (apache2 + nut-cgi)
# =======================================================================
# Needs the apache2 and nut-cgi packages, installed by the packages role.
# The pages are then at http://<host>/ and http://<host>/cgi-bin/nut/upsstats.cgi
# (plain HTTP; put a reverse proxy in front if you want TLS).
nut_server_web_enabled: true

# Redirect http://<host>/ to the status page instead of Apache's default page
nut_server_web_redirect_root: true

# Who may use the NUT pages. Each entry is an Apache 'Require' rule and any
# match grants access, e.g. ["ip 10.24.0.0/16"]. 'all granted' lets in everyone
# who can reach the host.
nut_server_web_require:
  - all granted

# upsset.cgi is the web admin page (uses the webadmin user). It stays off until
# you restrict nut_server_web_require above; the role refuses to enable it while
# access is still open to everyone.
nut_server_web_upsset_enabled: false

# =======================================================================
# Notification Callbacks (upssched)
# =======================================================================
# Commands to run when a UPS event happens, optionally after a delay. Empty by
# default; define them per host or group. Each callback:
#   event:     upsmon event (ONLINE, ONBATT, LOWBATT, FSD, COMMOK, COMMBAD,
#              SHUTDOWN, REPLBATT, NOCOMM, NOPARENT). Its entry in
#              nut_server_notifyflags must include EXEC.
#   name:      unique label (letters, digits, - and _)
#   command:   what to run (absolute path to a script, with any arguments)
#   delay:     seconds to wait after the event before running it (default 0)
#   desc:      text logged to syslog when it runs (default: the name)
#   cancel_on: optional events that cancel the callback while it is waiting
#
# Example, shut down a NAS 30 seconds after this server starts shutting down:
#   nut_server_upssched_callbacks:
#     - event: SHUTDOWN
#       name: flashstor-shutdown
#       command: /usr/local/sbin/asustor-flashstor-shutdown.sh
#       delay: 30
#       desc: "UPS shutdown event - shutting down the Flashstor NAS"
#
# Keep any delay well inside FINALDELAY, or the server powers off before the
# callback runs. The command runs as nut_server_run_as_user.
nut_server_upssched_callbacks: []

# Where the command script that runs the callbacks is installed
nut_server_upssched_cmdscript: /usr/local/sbin/upssched-cmd.sh

# =======================================================================
# Verification
# =======================================================================
# After applying, query each UPS via upsc. Set false while the device isn't
# attached yet.
nut_server_verify: true
