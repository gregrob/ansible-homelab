---
# NUT server handlers
#
# Triggered by the config-file tasks in tasks/main.yml. Handlers run once, at the
# end of the play (or at the flush_handlers task, which this role uses so the
# services are restarted before they are verified).

# Restart nut
# - nut-driver-enumerator: re-reads ups.conf and (re)creates the per-UPS
#   nut-driver@<name> units, so added, removed or changed UPS definitions take
#   effect.
# - nut-server: restarts upsd to pick up upsd.conf and upsd.users.
# - nut-monitor: restarts upsmon to pick up upsmon.conf.
# One handler restarts all three, in this order, because the later services
# depend on the earlier ones. daemon_reload picks up any regenerated units.
- name: Restart nut
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: restarted
    daemon_reload: true
  loop:
    - nut-driver-enumerator.service
    - nut-server.service
    - nut-monitor.service

# Restart apache2
# Used by the web interface tasks (setup_nut_web.yml). A restart rather than a
# reload because enabling the cgid module needs one, and Apache restarts in a
# second on a host this size.
- name: Restart apache2
  ansible.builtin.systemd:
    name: apache2.service
    state: restarted
