---
# Included tasks to configure SSH key access and encrypt secrets on the secrets server.
# These tasks run on the dynamically added secrets_server host as root.
#
# Steps performed:
# 1. Add the generated SSH public key to the secrets user's authorized_keys file
# 2. Set special permissions (0640) on authorized_keys for admin user read access
# 3. Run the encrypt-secrets.sh script to encrypt secrets with the newly added key

- block:

  # Add the generated public key to the secrets user's authorized_keys file,
  # restricted via a forced command so this key can ONLY ever run
  # serve-secret.sh — no interactive shell, no arbitrary commands, no port
  # forwarding. See serve-secret.sh for how it reads the actual requested
  # path from SSH_ORIGINAL_COMMAND under this restriction.
  - name: Add key to secrets server authorized_keys (secrets user), locked to serve-secret.sh only
    ansible.builtin.authorized_key:
      user: "{{ secrets_user }}"
      key: "{{ secrets_pubkey_content.content | b64decode }}"
      state: present
      exclusive: false
      manage_dir: false
      key_options: >-
        command="{{ secrets_homelab_server_scripts_dir }}/serve-secret.sh",no-port-forwarding,no-X11-forwarding,no-agent-forwarding,no-pty,no-user-rc

  # Ensure the authorized_keys file has the correct permissions (0640)
  # This is because the admin user then has read access to the file
  - name: Set permissions on authorized_keys file - special case for the secrets server
    ansible.builtin.file:
      path: "/home/{{ secrets_user }}/.ssh/authorized_keys"
      mode: '0640'

  # Run the encryption script to encrypt secrets using the newly added key
  - name: Encrypt the secrets with the newly added key (always flags CHANGED as script is executed)
    ansible.builtin.command: ./encrypt-secrets.sh
    args:
      chdir: "{{ secrets_homelab_server_scripts_dir }}"
    register: encrypt_result
    failed_when: false
    run_once: true

  # Fail clearly if encryption didn't succeed, calling out lock contention
  # (rc=24) specifically rather than a generic "non-zero return code" error
  - name: Fail with a clear message if encryption did not succeed
    ansible.builtin.fail:
      msg: |
        encrypt-secrets.sh failed (exit code {{ encrypt_result.rc }}).
        {% if encrypt_result.rc == 24 %}
        This means another encrypt-secrets.sh or backup-secrets.sh run was
        already holding /tmp/secrets-homelab.lock and this run deferred
        instead of running concurrently — likely the scheduled
        secrets-encrypt-backup.yaml playbook running at the same time.
        Usually not a real problem: re-run this connect flow once that
        other run has finished.
        {% else %}
        stderr:
        {{ encrypt_result.stderr }}
        {% endif %}
    when: encrypt_result.rc != 0

  delegate_to: secrets_server
  become: yes
  become_user: root
