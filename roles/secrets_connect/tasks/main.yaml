---
# Role to set up SSH key-based authentication with a secrets server and decrypt secrets using age encryption.
# Assumes age is installed on the target system.
#
# Steps performed:
#  1. Determine connection target (IP vs DNS) based on host-level secrets_server_use_ip flag
#  2. Set SSH key base path for secrets server connection
#  3. Ensure .ssh directory exists with proper permissions
#  4. Generate ED25519 SSH key pair for secrets server (if not exists)
#  5. Read the generated public key into a variable
#  6. Set correct permissions on the public key file
#  7. Create SSH config file with secure permissions if it doesn't exist
#  8. Add SSH config entry (injecting HostName IP mapping only if secrets_server_use_ip is true)
#  9. Add secrets server to known_hosts to avoid SSH host key verification prompts
#  10. Add secrets server host dynamically to inventory
#  11. Run secrets server operations (add SSH key to authorized_keys, encrypt secrets) - done under included tasks
#  12. Register secrets file path for decryption
#  13. Construct SSH command for decrypting secrets via age
#  14. Execute decryption command and display output

- block:

  # Determine target address (IP vs Hostname) and known_hosts entry format based on host var override
  - name: Set secrets server target facts
    ansible.builtin.set_fact:
      secrets_target_address: "{{ secret_server.host_ip if (secrets_server_use_ip | default(false)) else secret_server.hostname }}"
      secrets_known_hosts_prefix: "{{ secret_server.hostname + ',' + secret_server.host_ip if (secrets_server_use_ip | default(false)) else secret_server.hostname }}"

  # Create a variable for the filename base for the secrets server SSH key    
  - name: Set SSH key base path for secrets key
    ansible.builtin.set_fact:
      secrets_key_filename_base: "/home/{{ admin_user }}/.ssh/id_ed25519_secrets-server"

  # Ensure the .ssh directory exists with correct permissions and ownership
  - name: ensure ~/.ssh directory exists
    ansible.builtin.file:
      path: "/home/{{ admin_user }}/.ssh"
      state: directory
      mode: '0700'
      owner: "{{ admin_user }}"
      group: "{{ admin_group }}"

  # Generate a new SSH key for the secrets server if one doesn't already exist
  # (omitting 'mode' prevents openssh_keypair from resetting public key permissions on reruns)
  - name: generate SSH key for Secrets server
    ansible.builtin.openssh_keypair:
      path: "{{ secrets_key_filename_base }}"
      type: ed25519
      force: false   # do not overwrite if key already exists
      comment: "{{ secrets_key_comment | default(admin_user ~ '@' ~ inventory_hostname ~ ' (secrets server)') }}"

  # Explicitly set 0600 permissions on the private key
  - name: Set correct permissions on private key
    ansible.builtin.file:
      path: "{{ secrets_key_filename_base }}"
      mode: '0600'
      owner: "{{ admin_user }}"
      group: "{{ admin_group }}"

  # Explicitly set 0644 permissions on the public key
  - name: Set correct permissions on public key
    ansible.builtin.file:
      path: "{{ secrets_key_filename_base }}.pub"
      mode: '0644'
      owner: "{{ admin_user }}"
      group: "{{ admin_group }}"

  # Read the generated public key into a variable
  - name: Read generated public key
    ansible.builtin.slurp:
      src: "{{ secrets_key_filename_base }}.pub"
    register: secrets_pubkey_content

  # Add SSH config entry (injects HostName IP override ONLY if secrets_server_use_ip is true)
  - name: Add SSH config entry for {{ secret_server.hostname }}
    ansible.builtin.blockinfile:
      path: "/home/{{ admin_user }}/.ssh/config"
      owner: "{{ admin_user }}"
      group: "{{ admin_group }}"
      mode: '0600'
      create: yes
      marker: "# {mark} ANSIBLE MANAGED SSH CONFIG for {{ secret_server.hostname }}"
      block: |
        Host {{ secret_server.hostname }}
        {% if secrets_server_use_ip | default(false) %}
          HostName {{ secret_server.host_ip }}
        {% endif %}
          User {{ secret_server.secrets_user }}
          IdentityFile {{ secrets_key_filename_base }}
          IdentitiesOnly yes

  # Fetch public SSH key (via IP or DNS) and register it in known_hosts.
  # Replaces the scanned prefix with secrets_known_hosts_prefix ('hostname,IP' for IP scans, 'hostname' for DNS)
  # so Ansible validation passes and OpenSSH seamlessly verifies both the hostname alias and IP address.
  - name: Add secrets server to known_hosts
    ansible.builtin.known_hosts:
      name: "{{ secret_server.hostname }}"
      key: "{{ lookup('pipe', 'ssh-keyscan ' + secrets_target_address + ' | sed \"s/^' + secrets_target_address + '/' + secrets_known_hosts_prefix + '/\"') }}"
      path: "/home/{{ admin_user }}/.ssh/known_hosts"

# Add secrets server to known_hosts in plain text format.
  # 'name' is passed a single hostname to satisfy Ansible lookup requirements.
  # 'key' contains 'hostname,IP' so OpenSSH verifies both alias and IP address.
  - name: Add secrets server to known_hosts
    ansible.builtin.known_hosts:
      name: "{{ secret_server.hostname }}"
      key: "{{ item }}"
      path: "/home/{{ admin_user }}/.ssh/known_hosts"
    loop: "{{ lookup('pipe', 'ssh-keyscan ' + secrets_target_address + ' | grep -v \"^#\" | sed \"s/^' + secrets_target_address + '/' + secrets_known_hosts_prefix + '/\"').splitlines() }}"

  # Add the secrets server host to the inventory dynamically
  - name: Add secret server host dynamically
    ansible.builtin.add_host:
      name: secrets_server
      ansible_host: "{{ secrets_target_address }}"
      ansible_user: "{{ secret_server.admin_user }}"
      ansible_ssh_pass: "{{ secret_server.admin_password }}"
      ansible_become_password: "{{ secret_server.admin_password }}"
      groups:
        - secrets_access
    changed_when: false # Don't flag a change for this task, only adding a host

  # Run additional secrets server operations on the dynamically added secrets_server host
  - name: Run secrets server operations on secrets_server
    ansible.builtin.include_tasks: secrets_server_tasks.yaml
    vars:
      ansible_user: "{{ secret_server.admin_user }}"
      ansible_ssh_pass: "{{ secret_server.admin_password }}"
      ansible_become_password: "{{ secret_server.admin_password }}"

  # Register the secrets file path for decryption
  - name: Register secrets file path for decryption
    ansible.builtin.set_fact:
      secrets_file_path: "/srv/secrets/encrypted/test/test-code-string.secret.age"

  # Construct command using DNS hostname alias with BatchMode enabled
  - name: Construct command for decrypting secrets
    ansible.builtin.set_fact:
      decrypt_command: >-
        ssh -o BatchMode=yes {{ secret_server.secrets_user }}@{{ secret_server.hostname }}
        'cat {{ secrets_file_path }}' | age -d -i {{ secrets_key_filename_base }}

  # Decrypt the secrets using the constructed command
  - name: Decrypt the secrets using the constructed command
    ansible.builtin.shell: "{{ decrypt_command }}"
    register: decrypted_output
    changed_when: false # Don't flag a change because read only operation

  # Display the output of the decryption command
  - name: Display output of encryption command
    ansible.builtin.debug:
      var: decrypted_output.stdout

  become: yes
  become_user: "{{ admin_user }}"
