---
# Role to install and configure Docker on Debian/Ubuntu/Raspberry Pi OS systems
# 
# Steps performed:
#  1. Sets Docker architecture fact based on system architecture (maps aarch64 -> arm64)
#  2. Sets Docker OS distribution fact (maps Debian/Raspbian -> debian)
#  3. Shows detected system information for verification
#  4. Installs required packages (ca-certificates, curl, gnupg) for Docker setup
#  5. Creates /etc/apt/keyrings directory for GPG keys
#  6. Downloads Docker's official GPG key using get_url
#  7. Adds Docker's APT repository using DEB822 source format
#  8. Updates APT cache and installs Docker CE packages and plugins
#  9. Adds the admin user to the docker group for non-root Docker access

# Set Docker architecture fact using Debian/Docker naming conventions
- name: set docker architecture fact
  ansible.builtin.set_fact:
    docker_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64', 'armv7l': 'armhf'}[ansible_facts['architecture']] | default(ansible_facts['architecture']) }}"

# Determine OS repository endpoint (Raspberry Pi OS & Debian use 'debian')
- name: set docker OS distribution fact
  ansible.builtin.set_fact:
    docker_os: "{{ 'debian' if ansible_facts['distribution'] in ['Debian', 'Raspbian', 'Raspberry Pi OS'] else ansible_facts['distribution'] | lower }}"

# Show detected system info
- name: show detected architecture and OS codename
  ansible.builtin.debug:
    msg:
      - "Ansible architecture: {{ ansible_facts['architecture'] }}"
      - "Mapped Docker architecture: {{ docker_arch }}"
      - "Docker OS repository: {{ docker_os }}"
      - "OS codename: {{ ansible_facts['distribution_release'] }}"

# Install base packages needed for Docker setup
- name: install required packages for Docker setup
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: yes

# Create directory for apt keyrings
- name: create /etc/apt/keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

# Download Docker's GPG key
- name: download Docker GPG key
  ansible.builtin.command:
    cmd: "curl -fsSL https://download.docker.com/linux/{{ docker_os }}/gpg -o /etc/apt/keyrings/docker.asc"
  args:
    creates: /etc/apt/keyrings/docker.asc

# Ensure permissions on the GPG key
- name: set Docker GPG key permissions
  ansible.builtin.file:
    path: /etc/apt/keyrings/docker.asc
    mode: '0644'

# Add Docker's APT repository
- name: add Docker APT repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.sources
    mode: '0644'
    content: |
      Types: deb
      URIs: https://download.docker.com/linux/{{ docker_os }}
      Suites: {{ ansible_facts['distribution_release'] }}
      Components: stable
      Architectures: {{ docker_arch }}
      Signed-By: /etc/apt/keyrings/docker.asc
  register: docker_repo_file

# Update the apt cache forcefully ONLY if the repo file was just added/changed
- name: force apt cache update after adding repo
  ansible.builtin.apt:
    update_cache: yes
  when: docker_repo_file.changed

# (Optional) Standard cache update for subsequent runs if the file didn't change
- name: update apt cache normally (maybe CHANGED)
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: "{{ apt_cache_valid_time | default(3600) }}"
  when: not docker_repo_file.changed

# Install Docker packages
- name: install Docker packages
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

# Add admin user to docker group
- name: add admin user to docker group
  ansible.builtin.user:
    name: "{{ admin_user }}"
    groups: docker
    append: yes
