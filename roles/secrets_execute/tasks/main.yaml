---
# Role to execute multiple commands on the secrets server
# Executes a configurable list of commands directly on the secrets server
# Assumes proper SSH connection is already established via ansible_user

# Display the configuration being used
- name: Display secrets execution configuration
  ansible.builtin.debug:
    msg: |
      === Secrets Server Command Execution ===
      Target server:       {{ inventory_hostname }}
      Execution user:      {{ ansible_user | default('current') }}
      Working directory:   {{ secrets_homelab_server_scripts_dir }}
      Commands to execute: {{ (secrets_commands | default([])) | length }}
      Show output:         {{ 'Enabled' if (secrets_show_output | default(true) | bool) else 'Disabled' }}

# Fail if no commands provided
- name: Validate commands list
  ansible.builtin.fail:
    msg: "No commands specified! Please provide secrets_commands list."
  when: (secrets_commands | default([])) | length == 0

# Execute each command on the secrets server
- name: Execute commands on secrets server
  ansible.builtin.shell:
    cmd: "{{ item.cmd }}"
    chdir: "{{ secrets_homelab_server_scripts_dir }}"
  register: command_results
  loop: "{{ secrets_commands }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: false
  failed_when: false
  environment: "{{ item.environment | default({}) }}"
  no_log: "{{ item.no_log | default(false) | bool }}"

# Display command outputs cleanly in a single block without task-level looping
- name: Display command outputs
  ansible.builtin.debug:
    msg: |
      {% for item in command_results.results %}
      === Command: {{ item.item.name }} ===
      Exit code: {{ item.rc }}
      Output:
      {{ item.stdout if item.stdout | length > 0 else '(no stdout)' }}
      {% if item.stderr | default('') | length > 0 %}
      Errors:
      {{ item.stderr }}
      {% endif %}
      {% if not loop.last %}

      {% endif %}
      {% endfor %}
  when:
    - secrets_show_output | default(true) | bool
    - command_results.results is defined
    - command_results.results | length > 0

# Display execution summary
- name: Display execution summary
  ansible.builtin.debug:
    msg: |
      === Execution Summary ===
      Server:         {{ inventory_hostname }}
      Total commands: {{ (secrets_commands | default([])) | length }}
      Successful:     {{ command_results.results | selectattr('rc', 'equalto', 0) | list | length }}
      Failed:         {{ command_results.results | rejectattr('rc', 'equalto', 0) | list | length }}
      Timestamp:      {{ ansible_facts['date_time']['iso8601'] | default('N/A') }}

# Fail the play at the end if any command reported a non-zero exit code —
# including rc=24 (lock contention). Still surfaces as a failure (visible,
# red) since something unexpected did happen and is worth a look, but the
# message below explains explicitly when it's just the file lock doing its
# job, rather than requiring a dig through the command outputs to find out.
- name: Fail if any command reported a non-zero exit code
  ansible.builtin.fail:
    msg: |
      One or more commands failed. See the execution summary above for details.
      {% set lock_conflicts = command_results.results | selectattr('rc', 'equalto', 24) | list %}
      {% if lock_conflicts | length > 0 %}

      NOTE: {{ lock_conflicts | length }} command(s) exited with code 24 — this
      means encrypt-secrets.sh or backup-secrets.sh found another run already
      holding /tmp/secrets-homelab.lock and deferred instead of running
      concurrently. This usually isn't a real problem — check whether two
      triggers overlapped (e.g. a manual run during a scheduled one), then
      re-run if the work still needs to happen.
      {% endif %}
  when:
    - command_results.results is defined
    - command_results.results | rejectattr('rc', 'equalto', 0) | list | length > 0
