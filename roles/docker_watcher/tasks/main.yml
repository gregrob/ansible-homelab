---
# ------------------------------------------------------------------
# Part 1 — runs on every host: gather that host's container list
# (running + stopped) and normalise it into a flat per-host fact.
# ------------------------------------------------------------------

- name: Gather full container inventory (running + stopped) for this node
  community.docker.docker_host_info:
    containers: true
    containers_all: "{{ docker_watcher_include_stopped }}"
  register: docker_watcher_docker_info
  ignore_errors: true

- name: Note whether this node's Docker inventory could be gathered
  ansible.builtin.set_fact:
    docker_watcher_gather_failed: "{{ docker_watcher_docker_info is failed }}"

- name: Initialise this node's normalised container list
  ansible.builtin.set_fact:
    docker_watcher_containers: []

- name: Normalise each container's image/tag/state for this node
  ansible.builtin.set_fact:
    docker_watcher_containers: "{{ docker_watcher_containers + [entry] }}"
  loop: "{{ docker_watcher_docker_info.containers }}"
  loop_control:
    loop_var: c
    label: "{{ (c.Names[0] | default('unknown')) | regex_replace('^/', '') }}"
  when: not docker_watcher_gather_failed
  vars:
    # split_image_ref handles the registry-port-vs-tag-colon ambiguity
    # (e.g. "myregistry:5000/app:1.0") that a plain c.Image.split(':')
    # would get wrong — see filter_plugins/docker_utils.py.
    parsed_image: "{{ c.Image | split_image_ref }}"
    entry:
      node: "{{ inventory_hostname }}"
      name: "{{ (c.Names[0] | default('')) | regex_replace('^/', '') }}"
      image: "{{ c.Image }}"
      image_repo: "{{ parsed_image.repo }}"
      image_tag: "{{ parsed_image.tag }}"
      image_id: "{{ c.ImageID | default('') }}"
      state: "{{ c.State | default('unknown') }}"
      status: "{{ c.Status | default('') }}"

- name: Debug normalised container list for this node
  ansible.builtin.debug:
    msg:
      - "Node: {{ inventory_hostname }}"
      - "Total containers found: {{ docker_watcher_containers | length }}"
      - "Container details:"
      - "{{ docker_watcher_containers }}"
  when: docker_watcher_debug

# ------------------------------------------------------------------
# Part 2 — runs once (delegated to localhost) after every host has
# finished Part 1: combines every host's container list and builds
# the repo -> tag -> [nodes] summary used everywhere below.
# ------------------------------------------------------------------

- name: Flatten every node's container list into one combined list
  ansible.builtin.set_fact:
    docker_watcher_all_containers: "{{ docker_watcher_all_containers | default([]) + (hostvars[item].docker_watcher_containers | default([])) }}"
  loop: "{{ ansible_play_hosts }}"
  run_once: true
  delegate_to: localhost
  become: false

- name: Collect hosts where Docker inventory could not be gathered
  ansible.builtin.set_fact:
    docker_watcher_failed_hosts: "{{ docker_watcher_failed_hosts | default([]) + ([item] if (hostvars[item].docker_watcher_gather_failed | default(false)) else []) }}"
  loop: "{{ ansible_play_hosts }}"
  run_once: true
  delegate_to: localhost
  become: false

- name: Group containers by repo and tag to map version allocation across nodes
  ansible.builtin.set_fact:
    fleet_version_summary: >-
      {%- set output = {} -%}
      {%- for repo, repo_items in docker_watcher_all_containers | groupby('image_repo') -%}
        {%- set tag_groups = {} -%}
        {%- for tag, tag_items in repo_items | groupby('image_tag') -%}
          {%- set nodes = tag_items | map(attribute='node') | unique | list -%}
          {%- set _ = tag_groups.update({tag: nodes}) -%}
        {%- endfor -%}
        {%- set _ = output.update({repo: tag_groups}) -%}
      {%- endfor -%}
      {{ output }}
  run_once: true
  delegate_to: localhost
  become: false

- name: Debug the version allocation matrix
  ansible.builtin.debug:
    var: fleet_version_summary
  when: docker_watcher_debug
  run_once: true

# ------------------------------------------------------------------
# Part 3 — Docker Hub (including docker.io/) version check. Which
# tags count as real releases is decided by docker_watcher_tag_rules,
# falling back to docker_watcher_default_tag_regex. Other registries
# (ghcr.io, lscr.io, quay.io, private) are handled separately or not
# at all — see README.
# ------------------------------------------------------------------

- name: Identify unique Docker Hub image repos in use (including docker.io)
  ansible.builtin.set_fact:
    # Matches the regex OR an explicit docker.io/ prefix, since
    # docker.io always has a dot and the regex alone would exclude it.
    docker_watcher_hub_repos: >-
      {%- set results = [] -%}
      {%- for repo in (docker_watcher_all_containers | map(attribute='image_repo') | unique | list) -%}
        {%- if (repo is match(docker_watcher_docker_hub_repo_regex)) or repo.startswith('docker.io/') -%}
          {%- set _ = results.append(repo) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ results }}
  run_once: true
  delegate_to: localhost
  become: false

- name: Initialize latest stable dictionary
  ansible.builtin.set_fact:
    docker_watcher_latest_stable: {}
    docker_watcher_check_status: {}
  run_once: true
  delegate_to: localhost
  become: false

- name: Query Docker Hub for each repo's recent tags
  ansible.builtin.uri:
    url: "https://hub.docker.com/v2/repositories/{{ api_path }}/tags?page_size=100&ordering=last_updated"
    method: GET
    return_content: true
    timeout: 15
  loop: "{{ docker_watcher_hub_repos }}"
  loop_control:
    label: "{{ item }}"
  vars:
    # Docker Hub's API wants "namespace/repo":
    #   docker.io/library/postgres -> library/postgres
    #   postgres                   -> library/postgres
    #   linuxserver/plex           -> linuxserver/plex
    stripped: "{{ item | regex_replace('^docker\\.io/', '') }}"
    api_path: "{{ stripped if '/' in stripped else ('library/' ~ stripped) }}"
  register: docker_watcher_hub_tag_results
  ignore_errors: true
  run_once: true
  delegate_to: localhost
  check_mode: false
  become: false

- name: Work out the newest stable tag per repo
  ansible.builtin.set_fact:
    docker_watcher_latest_stable: "{{ docker_watcher_latest_stable | combine(latest_update) }}"
    docker_watcher_check_status: "{{ docker_watcher_check_status | combine({item.item: status_label}) }}"
  loop: "{{ docker_watcher_hub_tag_results.results }}"
  loop_control:
    label: "{{ item.item }}"
  vars:
    # Rules match on the bare "namespace/repo" identity, so strip any
    # docker.io/ and library/ wrapping first.
    step1: "{{ item.item | regex_replace('^docker\\.io/', '') }}"
    clean_repo: "{{ step1 | regex_replace('^library/', '') }}"
    active_regex: "{{ clean_repo | pick_tag_regex(docker_watcher_tag_rules, docker_watcher_default_tag_regex) }}"

    fetch_ok: "{{ item.status is defined and item.status == 200 }}"
    newest: "{{ (item.json.results | default([]) | get_latest_docker_tag(active_regex)) if fetch_ok else '' }}"
    status_label: "{{ 'resolved' if (fetch_ok and newest != '') else ('no_match' if fetch_ok else 'fetch_failed') }}"
    # Only stored when resolved — an empty "latest" would make every
    # downstream comparison register as "needs update".
    latest_update: "{{ {item.item: newest} if (fetch_ok and newest != '') else {} }}"
  run_once: true
  delegate_to: localhost
  become: false

# ------------------------------------------------------------------
# Part 4 — same as Part 3, for ghcr.io and lscr.io (linuxserver's
# pull-through cache of ghcr.io/linuxserver/*, treated as the same
# backend). Repos are matched against docker_watcher_tag_rules using
# the registry-stripped "org/repo" path, so one rule covers a repo
# regardless of which of the two served it.
#
# Token fetch + pagination both happen inside the ghcr_tags module
# (library/ghcr_tags.py) — one task per repo, not one per page.
# ------------------------------------------------------------------

- name: Identify unique ghcr.io / lscr.io image repos in use
  ansible.builtin.set_fact:
    docker_watcher_ghcr_repos: "{{ docker_watcher_all_containers | map(attribute='image_repo') | unique | select('match', '^(ghcr\\.io|lscr\\.io)/.+/.+$') | list }}"
  run_once: true
  delegate_to: localhost
  become: false

- name: Fetch every GHCR / lscr.io repo's full tag list (one task per repo)
  ghcr_tags:
    repo: "{{ item.split('/', 1)[1] }}"
    max_pages: "{{ docker_watcher_ghcr_max_pages }}"
  loop: "{{ docker_watcher_ghcr_repos }}"
  loop_control:
    label: "{{ item }}"
  register: docker_watcher_ghcr_tag_results
  ignore_errors: true
  run_once: true
  delegate_to: localhost
  check_mode: false
  become: false

- name: Work out the newest stable tag per ghcr.io / lscr.io repo
  ansible.builtin.set_fact:
    docker_watcher_latest_stable: "{{ docker_watcher_latest_stable | combine(latest_update) }}"
    docker_watcher_check_status: "{{ docker_watcher_check_status | combine({result.item: status_label}) }}"
  loop: "{{ docker_watcher_ghcr_tag_results.results }}"
  loop_control:
    loop_var: result
    label: "{{ result.item }}"
  vars:
    # Same host-stripped matching as the Docker Hub path — one rule
    # covers a repo regardless of which registry served it.
    match_key: "{{ result.item.split('/', 1)[1] }}"
    active_regex: "{{ match_key | pick_tag_regex(docker_watcher_tag_rules, docker_watcher_default_tag_regex) }}"
    fetch_ok: "{{ result.tags is defined and (result.tags | length) > 0 }}"
    newest: "{{ (result.tags | get_latest_docker_tag(active_regex)) if fetch_ok else '' }}"
    status_label: "{{ 'resolved' if (fetch_ok and newest != '') else ('no_match' if fetch_ok else 'fetch_failed') }}"
    latest_update: "{{ {result.item: newest} if (fetch_ok and newest != '') else {} }}"
  run_once: true
  delegate_to: localhost
  become: false

- name: Display container update summary
  ansible.builtin.debug:
    msg: |
      {% if docker_watcher_failed_hosts | default([]) | length > 0 %}
      ⚠ Could not gather Docker inventory from: {{ docker_watcher_failed_hosts | map('regex_replace', '\..*$', '') | join(', ') }}
      (containers on these hosts are NOT included below — check Docker/SDK access on them)

      {% endif %}
      {{ '=' * 130 }}
      {{ '%-45s | %-20s | %-22s | %-10s | %s' | format('REPOSITORY', 'CURRENT VERSION(S)', 'AVAILABLE VERSION', 'UPDATE?', 'HOSTS NEEDING UPDATE') }}
      {{ '-' * 130 }}
      {% for row in display_rows %}
      {{ '%-45s | %-20s | %-22s | %-10s | %s' | format(row.repo, row.current, row.latest, row.flag, row.hosts) }}
      {% endfor %}
      {{ '=' * 130 }}
  vars:
    # One precomputed row per repo actually attempted (Docker Hub +
    # GHCR/lscr.io lists) — not just docker_watcher_latest_stable, so
    # an unresolved repo still gets a row instead of disappearing.
    # Status labels ('resolved' / 'no_match' / 'fetch_failed') decide
    # what shows in the AVAILABLE column; only 'resolved' can star.
    display_rows: >-
      {%- set rows = [] -%}
      {%- set repo_list = ((docker_watcher_hub_repos | default([])) + (docker_watcher_ghcr_repos | default([]))) | unique | sort -%}
      {%- for repo in repo_list -%}
        {%- set latest_tag = docker_watcher_latest_stable.get(repo, '') -%}
        {%- set status = docker_watcher_check_status.get(repo, 'fetch_failed') -%}
        {%- set checked = status == 'resolved' -%}
        {%- set current_tags = (fleet_version_summary[repo].keys() | list) if fleet_version_summary[repo] is defined else [] -%}
        {%- set up_to_date = (current_tags == [latest_tag]) if (checked and current_tags) else true -%}
        {%- set outdated_hosts = [] -%}
        {%- set total_hosts = 0 -%}
        {%- if checked and fleet_version_summary[repo] is defined -%}
          {%- set total_hosts = (fleet_version_summary[repo].values() | map('length') | sum) -%}
          {%- for tag, nodes in fleet_version_summary[repo].items() -%}
            {%- if tag != latest_tag -%}
              {%- set _ = outdated_hosts.extend(nodes | map('regex_replace', '\..*$', '') | list) -%}
            {%- endif -%}
          {%- endfor -%}
        {%- endif -%}
        {%- set outdated_count = outdated_hosts | length -%}
        {%- if outdated_count == 0 -%}
          {%- set hosts_display = '' -%}
        {%- elif outdated_count == total_hosts and total_hosts > 5 -%}
          {%- set hosts_display = 'ALL (' ~ outdated_count ~ ')' -%}
        {%- elif outdated_count > 5 -%}
          {%- set hosts_display = outdated_count ~ ' hosts' -%}
        {%- else -%}
          {%- set hosts_display = outdated_hosts | sort | join(', ') -%}
        {%- endif -%}
        {%- set latest_display = (
              latest_tag if status == 'resolved'
              else ('no matching tag' if status == 'no_match'
              else 'fetch failed')
            ) -%}
        {%- set row = {
              'repo': repo,
              'current': (current_tags | join(', ')) if current_tags else 'Unknown',
              'latest': latest_display,
              'flag': ('★' if (checked and not up_to_date) else ''),
              'hosts': hosts_display
            } -%}
        {%- set _ = rows.append(row) -%}
      {%- endfor -%}
      {{ rows }}
  run_once: true
  delegate_to: localhost
  become: false
