---
# ------------------------------------------------------------------
# Part 1 — runs on EVERY host in the play: gather that host's own
# container list (running + stopped) and normalise it into a flat,
# easy-to-report-on structure stored in the host's own facts.
# ------------------------------------------------------------------

- name: Gather full container inventory (running + stopped) for this node
  community.docker.docker_host_info:
    containers: true
    containers_all: "{{ watchtower_include_stopped }}"
  register: watchtower_docker_info

- name: Initialise this node's normalised container list
  ansible.builtin.set_fact:
    watchtower_containers: []

- name: Normalise each container's image/tag/state for this node
  ansible.builtin.set_fact:
    watchtower_containers: "{{ watchtower_containers + [entry] }}"
  loop: "{{ watchtower_docker_info.containers }}"
  loop_control:
    loop_var: c
    label: "{{ (c.Names[0] | default('unknown')) | regex_replace('^/', '') }}"
  vars:
    entry:
      node: "{{ inventory_hostname }}"
      name: "{{ (c.Names[0] | default('')) | regex_replace('^/', '') }}"
      image: "{{ c.Image }}"
      image_repo: "{{ c.Image.split(':')[0] }}"
      image_tag: "{{ c.Image.split(':')[1] if ':' in c.Image else 'latest' }}"
      image_id: "{{ c.ImageID | default('') }}"
      state: "{{ c.State | default('unknown') }}"
      status: "{{ c.Status | default('') }}"

- name: Debug normalised container list for this node
  ansible.builtin.debug:
    msg:
      - "Node: {{ inventory_hostname }}"
      - "Total containers found: {{ watchtower_containers | length }}"
      - "Container details:"
      - "{{ watchtower_containers }}"
  when: watchtower_debug

# ------------------------------------------------------------------
# Part 2 — runs ONCE, delegated to localhost, after every host has
# completed Part 1 above (Ansible executes task-by-task across the
# whole play by default, so hostvars for every node are already
# populated by the time we get here).
# ------------------------------------------------------------------

- name: Flatten every node's container list into one combined list
  ansible.builtin.set_fact:
    watchtower_all_containers: "{{ watchtower_all_containers | default([]) + (hostvars[item].watchtower_containers | default([])) }}"
  loop: "{{ ansible_play_hosts }}"
  run_once: true
  delegate_to: localhost

- name: Group containers by repo and tag to map version allocation across nodes
  ansible.builtin.set_fact:
    fleet_version_summary: >-
      {%- set output = {} -%}
      {%- for repo, repo_items in watchtower_all_containers | groupby('image_repo') -%}
        {%- set tag_groups = {} -%}
        {%- for tag, tag_items in repo_items | groupby('image_tag') -%}
          {%- set nodes = tag_items | map(attribute='node') | unique | list -%}
          {%- set _ = tag_groups.update({tag: nodes}) -%}
        {%- endfor -%}
        {%- set _ = output.update({repo: tag_groups}) -%}
      {%- endfor -%}
      {{ output }}
  run_once: true
  delegate_to: localhost

- name: Debug the version allocation matrix
  ansible.builtin.debug:
    var: fleet_version_summary
  when: watchtower_debug
  run_once: true

# ------------------------------------------------------------------
# Part 3 — for images hosted on Docker Hub, look up what's actually
# available upstream and flag repos where a newer *stable* version
# exists. Which tags count as "real" versions is decided per-repo by
# watchtower_tag_rules (ordered, first-match-wins — see defaults),
# falling back to watchtower_default_tag_regex. This naturally
# excludes "latest", "nightly", "edge", "beta", "rc", "dev", "test",
# "alpha", "canary", etc. without a maintained exclude-list, since
# all of those contain letters. Non-Docker-Hub registries (ghcr.io,
# lscr.io, quay.io, private registries) are skipped for now — see
# README.
# ------------------------------------------------------------------

- name: Identify unique Docker Hub image repos in use (skip other registries)
  ansible.builtin.set_fact:
    watchtower_hub_repos: "{{ watchtower_all_containers | selectattr('image_repo', 'match', watchtower_docker_hub_repo_regex) | map(attribute='image_repo') | unique | list }}"
  run_once: true
  delegate_to: localhost

- name: Initialize latest stable dictionary
  ansible.builtin.set_fact:
    watchtower_latest_stable: {}
  run_once: true
  delegate_to: localhost

- name: Query Docker Hub for each repo's recent tags
  ansible.builtin.uri:
    url: "https://hub.docker.com/v2/repositories/{{ (('/' in item) | ternary(item, 'library/' ~ item)) }}/tags?page_size=100&ordering=last_updated"
    method: GET
    return_content: true
  loop: "{{ watchtower_hub_repos }}"
  loop_control:
    label: "{{ item }}"
  register: watchtower_hub_tag_results
  ignore_errors: true
  run_once: true
  delegate_to: localhost
  check_mode: false
  become: false

- name: Work out the newest stable tag per repo
  ansible.builtin.set_fact:
    watchtower_latest_stable: "{{ watchtower_latest_stable | combine({item.item: newest}) }}"
  loop: "{{ watchtower_hub_tag_results.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.status is defined and item.status == 200
  vars:
    # Ordered-list lookup, first-match-wins, resolved in Python
    # (filter_plugins/docker_utils.py) instead of a nested Jinja
    # loop — priority is now just "position in the list".
    active_regex: "{{ item.item | pick_tag_regex(watchtower_tag_rules, watchtower_default_tag_regex) }}"
    newest: "{{ item.json.results | default([]) | get_latest_docker_tag(active_regex) }}"
  run_once: true
  delegate_to: localhost

# ------------------------------------------------------------------
# Part 4 — same idea as Part 3, but for ghcr.io and lscr.io.
# lscr.io is linuxserver's own pull-through cache in front of
# ghcr.io/linuxserver/*, so it's treated as the same backend here:
# both get their registry host stripped down to "org/repo" before
# doing anything else, which also means watchtower_tag_rules prefixes
# (e.g. "linuxserver/qbittorrent") apply unchanged regardless of
# which of the two actually served the image.
#
# The token fetch + Link-header pagination both happen INSIDE the
# ghcr_tags module (library/ghcr_tags.py) — one Ansible task per repo,
# not one task per page. Two things this fixes versus the earlier
# recursive-include_tasks version:
#   - speed: pagination now runs as a tight Python loop in a single
#     module invocation, instead of N full Ansible task executions
#     (each with its own templating/connection overhead) per repo.
#   - correctness of run_once: dynamic include_tasks doesn't reliably
#     dedupe run_once across hosts (each host re-expands it
#     independently), which was silently multiplying this whole
#     fetch by however many docker hosts are in the play. A plain
#     module task doesn't have that problem — run_once here behaves
#     exactly like it does in Part 3's Docker Hub tasks.
# ------------------------------------------------------------------

- name: Identify unique ghcr.io / lscr.io image repos in use
  ansible.builtin.set_fact:
    watchtower_ghcr_repos: "{{ watchtower_all_containers | map(attribute='image_repo') | unique | select('match', '^(ghcr\\.io|lscr\\.io)/.+/.+$') | list }}"
  run_once: true
  delegate_to: localhost

- name: Fetch every GHCR / lscr.io repo's full tag list (one task per repo)
  ghcr_tags:
    repo: "{{ item.split('/', 1)[1] }}"
    max_pages: "{{ watchtower_ghcr_max_pages }}"
  loop: "{{ watchtower_ghcr_repos }}"
  loop_control:
    label: "{{ item }}"
  register: watchtower_ghcr_tag_results
  ignore_errors: true
  run_once: true
  delegate_to: localhost
  check_mode: false
  become: false

- name: Work out the newest stable tag per ghcr.io / lscr.io repo
  ansible.builtin.set_fact:
    watchtower_latest_stable: "{{ watchtower_latest_stable | combine({result.item: newest}) }}"
  loop: "{{ watchtower_ghcr_tag_results.results }}"
  loop_control:
    loop_var: result
    label: "{{ result.item }}"
  when: result.tags is defined and (result.tags | length) > 0
  vars:
    # Match against the host-stripped path ("linuxserver/sonarr"),
    # not the full "lscr.io/linuxserver/sonarr" — same reasoning as
    # the Docker Hub path: one rule covers a repo regardless of which
    # registry actually served it.
    match_key: "{{ result.item.split('/', 1)[1] }}"
    active_regex: "{{ match_key | pick_tag_regex(watchtower_tag_rules, watchtower_default_tag_regex) }}"
    newest: "{{ result.tags | get_latest_docker_tag(active_regex) }}"
  run_once: true
  delegate_to: localhost

- name: Display container update summary
  ansible.builtin.debug:
    msg: |
      {{ '=' * 130 }}
      {{ '%-45s | %-20s | %-22s | %-10s | %s' | format('REPOSITORY', 'CURRENT VERSION(S)', 'AVAILABLE VERSION', 'UPDATE?', 'HOSTS NEEDING UPDATE') }}
      {{ '-' * 130 }}
      {% for row in display_rows %}
      {{ '%-45s | %-20s | %-22s | %-10s | %s' | format(row.repo, row.current, row.latest, row.flag, row.hosts) }}
      {% endfor %}
      {{ '=' * 130 }}
  vars:
    # One precomputed row per repo, rather than nested logic inside
    # the msg template itself — easier to read/extend.
    display_rows: >-
      {%- set rows = [] -%}
      {%- for repo, latest_tag in watchtower_latest_stable.items() -%}
        {%- set current_tags = (fleet_version_summary[repo].keys() | list) if fleet_version_summary[repo] is defined else [] -%}
        {%- set up_to_date = (current_tags == [latest_tag]) if current_tags else false -%}
        {%- set outdated_hosts = [] -%}
        {%- set total_hosts = 0 -%}
        {%- if fleet_version_summary[repo] is defined -%}
          {%- set total_hosts = (fleet_version_summary[repo].values() | map('length') | sum) -%}
          {%- for tag, nodes in fleet_version_summary[repo].items() -%}
            {%- if tag != latest_tag -%}
              {%- set _ = outdated_hosts.extend(nodes | map('regex_replace', '\..*$', '') | list) -%}
            {%- endif -%}
          {%- endfor -%}
        {%- endif -%}
        {%- set outdated_count = outdated_hosts | length -%}
        {%- if outdated_count == 0 -%}
          {%- set hosts_display = '' -%}
        {%- elif outdated_count == total_hosts and total_hosts > 5 -%}
          {%- set hosts_display = 'ALL (' ~ outdated_count ~ ')' -%}
        {%- elif outdated_count > 5 -%}
          {%- set hosts_display = outdated_count ~ ' hosts' -%}
        {%- else -%}
          {%- set hosts_display = outdated_hosts | sort | join(', ') -%}
        {%- endif -%}
        {%- set row = {
              'repo': repo,
              'current': (current_tags | join(', ')) if current_tags else 'Unknown',
              'latest': latest_tag,
              'flag': ('★' if not up_to_date else ''),
              'hosts': hosts_display
            } -%}
        {%- set _ = rows.append(row) -%}
      {%- endfor -%}
      {{ rows }}
  run_once: true
  delegate_to: localhost
