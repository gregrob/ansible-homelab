---
# Re-enables two diagnostic debug tasks (per-node container dump, and
# the repo/tag/node allocation matrix). Off by default; turn on with
# -e docker_watcher_debug=true when something looks wrong.
docker_watcher_debug: false

# Set false to only inventory currently-running containers.
docker_watcher_include_stopped: true

# Matches image repos with no registry host (Docker Hub), e.g.
# "portainer/agent" or "nginx" — but not "ghcr.io/x/y" or
# "lscr.io/x/y", which are handled separately (see
# docker_watcher_ghcr_max_pages below).
docker_watcher_docker_hub_repo_regex: '^[^./:]+(/[^./:]+)?$'

# Safety cap on how many pages library/ghcr_tags.py will fetch per
# GHCR/lscr.io repo (GHCR's tag list has no "most recent" ordering,
# so it pages through the whole thing via the Link header). At 1000
# tags/page this allows up to this many thousand tags per repo. A
# repo that exceeds it fails safe to "not checked" rather than risk a
# wrong answer — raise this if a specific repo needs more.
docker_watcher_ghcr_max_pages: 40

# ORDERED list of {prefix, regex} — first prefix match wins, so put
# more specific prefixes above more general ones (e.g. a
# repo-specific rule above the family-wide "linuxserver/" rule).
# Each regex decides which tags count as real releases for that repo,
# filtering out CI/nightly/build noise before the newest one is
# picked.
docker_watcher_tag_rules:
  # qbittorrent (linuxserver): <version>_v<libtorrent>-ls<build>
  - prefix: "linuxserver/qbittorrent"
    regex: '^\d+(\.\d+){1,3}_v\d+(\.\d+){1,3}-ls\d+$'

  # gluetun: full vX.Y.Z only — excludes floating aliases (v3, v3.41)
  # and non-release CI tags.
  - prefix: "qmcgaw/gluetun"
    regex: '^v\d+\.\d+\.\d+$'

  # postgres (alpine variant): <postgres_version>-alpine<alpine_version>,
  # minor version required on both sides.
  - prefix: "postgres"
    regex: '^\d+\.\d+-alpine\d+\.\d+$'

  # speedtest-tracker (linuxserver): v<version>-ls<build> — the only
  # linuxserver image that requires a "v" prefix. Must precede the
  # generic "linuxserver/" rule below.
  - prefix: "linuxserver/speedtest-tracker"
    regex: '^v\d+(\.\d+)*-ls\d+$'

  # Linuxserver images generally: <version>-ls<build>. The "-ls<build>"
  # suffix is required, not optional, so a bare numeric tag can't
  # outrank the real release tag.
  - prefix: "linuxserver/"
    regex: '^\d+(\.\d+)*-ls\d+$'

  # Alpine: plain three-part versions only.
  - prefix: "alpine"
    regex: '^\d+\.\d+\.\d+$'

  # open-webui: requires a "v" prefix (their real releases are
  # v-prefixed).
  - prefix: "open-webui/open-webui"
    regex: '^v\d+\.\d+\.\d+$'

# Fallback when no rule above matches: plain numeric, optional "v",
# at least one dot required. The dot requirement matters — without
# it, a bare integer (a CI build number, a date-stamp tag) can
# outrank a real multi-part version in the numeric sort. A repo with
# no matching rule fails safe to "not checked" rather than risk a
# wrong answer.
docker_watcher_default_tag_regex: '^v?\d+(\.\d+){1,3}$'
