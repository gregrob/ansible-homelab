# Included tasks to handle individual GitHub repository cloning with SSH key generation.
# Called in a loop for each repository defined in the github_clone role.

# Generate an SSH key for the repo if it doesn't exist
- name: Include github_keygen role for {{ current_repo.name }}
  ansible.builtin.include_role:
    name: github_keygen
  vars:
    github_repo_name: "{{ current_repo.name }}"
    github_key_comment: "{{ admin_user }}@{{ inventory_hostname }} (repo: {{ current_repo.name }})"

# Display confirmation box and public key
- name: Display confirmation box and public key
  ansible.builtin.debug:
    msg: |
      ┌──────────────────────────────────────────────────────────────┐
      │ Please confirm that the SSH public key has been added to the │
      │ GitHub repository's deploy keys or your account SSH keys.    │
      │                                                              │
      │ Press Enter to continue or Ctrl+C to abort.                  │
      └──────────────────────────────────────────────────────────────┘
      SSH public key for {{ current_repo.name }}:
      {{ public_key_content.content | b64decode | trim }}

# Pause for user confirmation (skippable via automation flag)
- name: Wait for user to confirm
  ansible.builtin.pause:
    prompt: "Press Enter to continue..."
  when: not (skip_confirmation | default(false) | bool)

# Ensure the repo directory exists (escalates to root to create system paths like /srv)
- name: Ensure repo folder exists
  ansible.builtin.file:
    path: "{{ current_repo.dest }}"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_group }}"
    mode: '0755'
  become: yes
  become_user: root

# Clone the GitHub repository using the generated SSH key
- name: Clone GitHub repo
  ansible.builtin.git:
    repo: "git@github.com-{{ current_repo.name }}:{{ github_user }}/{{ current_repo.name }}.git"
    dest: "{{ current_repo.dest }}"
    version: main
    accept_hostkey: yes
    key_file: "{{ github_key_filename_base }}"
