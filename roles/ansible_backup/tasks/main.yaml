---
# Tasks: ansible_backup
# Archives local SSH keys and Vault files per host, encrypts them with gpg (AES256), then transfers the encrypted tarballs to the NAS via SCP.

- name: Generate timestamp for backup filename
  ansible.builtin.set_fact:
    backup_timestamp: "{{ ansible_facts['date_time']['iso8601_basic_short'] }}"

- name: Ensure local staging directory exists
  ansible.builtin.file:
    path: "{{ ansible_backup_staging_dir }}"
    state: directory
    mode: '0700'

- name: Create encrypted compressed tarball of Ansible backup targets
  ansible.builtin.shell:
    cmd: >
      set -o pipefail;
      tar -czf - {{ ansible_backup_targets | join(' ') }} |
      gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3
      --symmetric --cipher-algo AES256
      --output {{ ansible_backup_staging_dir }}/{{ inventory_hostname }}-ansible-backup-{{ backup_timestamp }}.tar.gz.gpg 3<<<"$BACKUP_PASS"
    executable: /bin/bash
  environment:
    BACKUP_PASS: "{{ backup_encryption_passphrase }}"
  changed_when: true
  no_log: true

- name: Ensure destination directory exists on NAS
  ansible.builtin.command:
    cmd: "sshpass -e ssh -o StrictHostKeyChecking=accept-new {{ ansible_backup_nas_user }}@{{ ansible_backup_nas_host }} 'mkdir -p {{ ansible_backup_nas_dest_dir }}'"
  environment:
    SSHPASS: "{{ ansible_backup_nas_password }}"
  changed_when: false
  no_log: true

- name: Push backup tarball to NAS via SCP
  ansible.builtin.command:
    cmd: >
      sshpass -e scp -o StrictHostKeyChecking=accept-new
      {{ ansible_backup_staging_dir }}/{{ inventory_hostname }}-ansible-backup-{{ backup_timestamp }}.tar.gz.gpg
      {{ ansible_backup_nas_user }}@{{ ansible_backup_nas_host }}:{{ ansible_backup_nas_dest_dir }}/
  environment:
    SSHPASS: "{{ ansible_backup_nas_password }}"
  no_log: true

- name: Clean up local staging directory
  ansible.builtin.file:
    path: "{{ ansible_backup_staging_dir }}"
    state: absent
