- name: display network configuration
  ansible.builtin.debug:
    msg:
      - "┌──────────────────────────────────────────────────────────────┐"
      - "│              Network Interface Configuration                  │"
      - "└──────────────────────────────────────────────────────────────┘"
      - "Frontend  : {{ frontend_interface }} → {{ frontend_address }}"
      - "Gateway   : {{ frontend_gateway }}"
      - "DNS       : {{ frontend_dns }}"
      - "{{ 'Backbone  : ' + backbone_interface + ' → ' + backbone_address if backbone_enabled else 'Backbone  : (none)' }}"

- name: display backbone allowed IPs
  ansible.builtin.debug:
    msg: "  - {{ item }}"
  loop: "{{ backbone_allowed_ips }}"
  when: backbone_enabled

- name: install packages for network configuration and firewall management
  ansible.builtin.apt:
    name: "{{ ['resolvconf'] + (['iptables'] if backbone_enabled else []) }}"
    state: present
    update_cache: true

- name: flush all iptables rules for backbone interface
  ansible.builtin.shell: |
    iptables-save | grep -v "{{ backbone_interface }}" | iptables-restore
  changed_when: false
  when: backbone_enabled

- name: deploy network interfaces file
  ansible.builtin.template:
    src: interfaces.j2
    dest: /etc/network/interfaces
    owner: root
    group: root
    mode: '0644'
    backup: yes

- name: restart networking
  ansible.builtin.service:
    name: networking
    state: restarted
  changed_when: false
  