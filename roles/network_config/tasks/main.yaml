---
- name: fail if network_interfaces is not defined for this host
  ansible.builtin.assert:
    that:
      - network_interfaces is defined
    fail_msg: >-
      {{ inventory_hostname }} does not define network_interfaces. The
      legacy frontend_*/backbone_* format is no longer supported by this
      role - define network_interfaces directly in this host's
      host_vars (see roles/network_config/defaults/main.yaml for the
      schema).
  tags: [always]

# ───────────────────────────────────────────────────────────────────────
# Raspberry Pi network stack migration (NetworkManager -> ifupdown).
# Both phases are tagged 'never' and only run when explicitly requested -
# a normal run of this role never touches NetworkManager on a Pi host.
# See the two files for the full safety design.
#
#   --tags raspberrypi_bootstrap   installs ifupdown, deploys config,
#                                   reboots, verifies (PHASE 1)
#   --tags raspberrypi_cleanup     purges NetworkManager/dhcpcd, only
#                                   after bootstrap is confirmed (PHASE 2)
# ───────────────────────────────────────────────────────────────────────

- name: raspberry pi network stack bootstrap (phase 1 - tagged never, explicit opt-in only)
  ansible.builtin.import_tasks: raspberrypi_network_stack_bootstrap.yml

- name: raspberry pi network stack cleanup (phase 2 - tagged never, explicit opt-in only)
  ansible.builtin.import_tasks: raspberrypi_network_stack_cleanup.yml

- name: display network configuration
  ansible.builtin.debug:
    msg:
      - "┌──────────────────────────────────────────────────────────────┐"
      - "│              Network Interface Configuration                  │"
      - "└──────────────────────────────────────────────────────────────┘"
      - "{{ '%-16s -> %-15s  (%s)%s' | format(item.name, item.address | default('no IP (manual)'), item.purpose | default('no purpose set'), item.vlan_id is defined and (' vlan ' ~ item.vlan_id) or '') }}"
  loop: "{{ network_interfaces }}"
  loop_control:
    label: "{{ item.name }}"

- name: display firewalled interface allow-lists
  ansible.builtin.debug:
    msg: "{{ item.0.name }} allows: {{ item.1 }}"
  loop: "{{ network_interfaces | subelements('allowed_ips', skip_missing=True) }}"
  loop_control:
    label: "{{ item.0.name }} <- {{ item.1 }}"
  when: item.0.firewalled | default(false)

- name: check whether any interface needs VLAN support
  ansible.builtin.set_fact:
    network_needs_vlan: "{{ network_interfaces | selectattr('vlan_id', 'defined') | list | length > 0 }}"

- name: check whether any interface needs firewalling
  ansible.builtin.set_fact:
    network_needs_firewall: "{{ network_interfaces | selectattr('firewalled', 'defined') | selectattr('firewalled') | list | length > 0 }}"

- name: install packages for network configuration, VLANs, and firewall management
  ansible.builtin.apt:
    name: "{{ ['resolvconf'] + (['vlan'] if network_needs_vlan else []) + (['iptables'] if network_needs_firewall else []) }}"
    state: present
    update_cache: true

# ───────────────────────────────────────────────────────────────────────
# Raspberry Pi OS ships cloud-init, which regenerates network config on
# boot (typically via /etc/network/interfaces.d/ or netplan) and will
# silently undo the static config this role deploys. Disable it before
# templating the interfaces file, not after, so a reboot mid-run can't
# leave the host on cloud-init's config instead of ours.
# ───────────────────────────────────────────────────────────────────────

- name: disable cloud-init network configuration stage on Raspberry Pi
  ansible.builtin.copy:
    dest: /etc/cloud/cloud.cfg.d/99-disable-network-config.cfg
    content: |
      # Managed by Ansible (network_config role) - cloud-init must not
      # touch networking, this role owns /etc/network/interfaces
      network: {config: disabled}
    owner: root
    group: root
    mode: '0644'
  when: (target_type | default('none')) == 'rpi'
  register: cloud_init_network_disabled

- name: purge cloud-init entirely on Raspberry Pi
  ansible.builtin.apt:
    name: cloud-init
    state: absent
    purge: true
    autoremove: true
  when:
    - (target_type | default('none')) == 'rpi'
    - raspberry_pi_purge_cloud_init | default(false) | bool

- name: clean cloud-init state so the disable takes effect cleanly
  ansible.builtin.shell: cloud-init clean --logs
  changed_when: false
  when:
    - (target_type | default('none')) == 'rpi'
    - not (raspberry_pi_purge_cloud_init | default(false) | bool)
    - cloud_init_network_disabled.changed | default(false)

- name: flush existing iptables rules for firewalled interfaces
  ansible.builtin.shell: |
    iptables-save | grep -v "{{ item.name }}" | iptables-restore
  changed_when: false
  loop: "{{ network_interfaces }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.firewalled | default(false)

- name: deploy network interfaces file
  ansible.builtin.template:
    src: interfaces.j2
    dest: /etc/network/interfaces
    owner: root
    group: root
    mode: '0644'
    backup: yes

- name: restart networking
  ansible.builtin.service:
    name: networking
    state: restarted
  changed_when: false
