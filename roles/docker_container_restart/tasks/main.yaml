---
# =============================================================================
# docker_container_restart.yaml
#
# Restarts a single docker container on the current host by running its
# stop/start scripts, searching for the container across ALL repos defined
# in github_repos (not just docker-homelab) since the same container name
# could exist in more than one repo.
#
# See the wiki for full details. Summary:
#
# Variables:
#   target_container          (required) name of the container directory to
#                              target, e.g. -e target_container=frigate
#   docker_restart_wait_time  seconds to wait between stop and start (default 5)
#   docker_script_version     version/interface tag passed to the stop/start
#                              scripts (default v2)
#   docker_stop_script        stop script, relative to the container's
#                              directory (default ../docker-stop.sh {{ docker_script_version }})
#   docker_start_script       start script, relative to the container's
#                              directory (default ../docker-start.sh {{ docker_script_version }})
#
# How it works:
#   1. Iterates every repo in github_repos and stats the candidate container
#      directory for each:
#      {{ repo.dest }}/servers/{{ ansible_facts['hostname'] }}/{{ target_container }}
#   2. Builds a list of repos where that directory actually exists on this
#      host. It's possible for the same container name to exist in more
#      than one repo (e.g. mid-migration between repos), so ALL matches are
#      restarted, not just the first.
#   3. Displays a summary of repos checked vs repos matched, for visibility.
#   4. If no repo has a matching directory, skips this host cleanly rather
#      than failing the playbook.
#   5. For each matching repo, executes the stop script, waits
#      docker_restart_wait_time, then executes the start script - via the
#      included restart_single_container.yaml tasks file.
#
# Note on the "../" paths: containers live in a shared folder under
# /docker/ in each repo, and are symlinked under each host's directory.
# That's why the stop/start scripts are referenced with a relative "../"
# path - it resolves through the symlink to the shared /docker/ scripts,
# regardless of which host or which repo is running it.
# =============================================================================

- name: ensure target_container variable is defined
  ansible.builtin.assert:
    that: target_container is defined
    msg: "target_container variable must be provided (e.g., -e target_container=frigate)"

# reset accumulator fact in case this file runs more than once in the same
# play (e.g. looped over multiple target_containers) - facts persist for
# the life of the host, not just one task run, so without this a second
# run would start from the previous run's matches instead of an empty list
- name: reset matching_containers accumulator
  ansible.builtin.set_fact:
    matching_containers: []

# stat the candidate container directory in every configured repo. stat
# never fails on a missing path, so this is safe to run unconditionally
# across the whole list.
- name: check container directory in each configured repo
  ansible.builtin.stat:
    path: "{{ item.dest }}/servers/{{ ansible_facts['hostname'] }}/{{ target_container }}"
  register: container_dir_stats
  loop: "{{ github_repos | default([]) }}"
  loop_control:
    label: "{{ item.name }}"

# reduce the per-repo stat results down to just the repos where the
# container directory actually exists. each entry keeps 'name' and 'dest'
# (from the original github_repos item) plus the resolved 'container_dir'.
- name: build list of repos containing this container
  ansible.builtin.set_fact:
    matching_containers: >-
      {{ matching_containers +
         [ {
             'name': item.item.name,
             'dest': item.item.dest,
             'container_dir': item.item.dest ~ '/servers/' ~ ansible_facts['hostname'] ~ '/' ~ target_container
           } ]
      }}
  loop: "{{ container_dir_stats.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.stat.exists | default(false)

# single joined line - checked vs matched, no repr/bracket noise
- name: display repo search summary
  ansible.builtin.debug:
    msg: "'{{ target_container }}' on host {{ ansible_facts['hostname'] }} - checked: {{ github_repos | default([]) | map(attribute='name') | join(', ') }} | matched: {{ matching_containers | map(attribute='name') | join(', ') }}"

# if nothing matched in any repo, say so but don't fail the playbook
- name: report missing container directory
  ansible.builtin.debug:
    msg: "container '{{ target_container }}' does not exist in any configured repo on host {{ ansible_facts['hostname'] }}. skipping."
  when: matching_containers | length == 0

# restart the container in every repo where it was found
- name: process container restart in each matching repo
  ansible.builtin.include_tasks: restart_single_container.yaml
  loop: "{{ matching_containers }}"
  loop_control:
    loop_var: matched_repo
    label: "{{ matched_repo.name }}"
  when: matching_containers | length > 0
