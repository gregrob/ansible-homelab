---
# =============================================================================
# docker_container_restart.yaml
#
# Restarts one or more docker containers on the current host by running
# their stop/start scripts, searching for each container across ALL repos
# defined in github_repos (not just docker-homelab) since the same
# container name could exist in more than one repo.
#
# See the wiki for full details. Summary:
#
# Variables:
#   target_container          (required) name of the container directory to
#                              target. Accepts:
#                              - A single string: -e target_container=frigate
#                              - A native list: -e '{"target_container": ["arr", "arr-prv"]}'
#                              - A stringified list (e.g., from Semaphore UI)
#                              (useful for containers that depend on each
#                              other and need restarting as a group)
#   docker_restart_wait_time  seconds to wait between stop and start (default 5)
#   docker_script_version     version/interface tag passed to the stop/start
#                              scripts (default v2)
#   docker_stop_script        stop script, relative to the container's
#                              directory (default ../docker-stop.sh {{ docker_script_version }})
#   docker_start_script       start script, relative to the container's
#                              directory (default ../docker-start.sh {{ docker_script_version }})
#
# How it works:
#   1. Normalizes target_container into a list, safely parsing plain strings,
#      native lists, and JSON string arrays, so single and multiple
#      containers work identically from here on.
#   2. For each name in that list, includes restart_container_across_repos.yaml
#      which scans every repo in github_repos for that container and
#      restarts it in every repo where it's actually found.
#   3. Containers are processed one at a time, in the order given - list a
#      dependency before its dependents if order matters (e.g.
#      ["arr", "arr-prv"] restarts arr first, then arr-prv).
#
# Note on the "../" paths: containers live in a shared folder under
# /docker/ in each repo, and are symlinked under each host's directory.
# That's why the stop/start scripts are referenced with a relative "../"
# path - it resolves through the symlink to the shared /docker/ scripts,
# regardless of which host or which repo is running it.
# =============================================================================

- name: ensure target_container variable is defined
  ansible.builtin.assert:
    that: target_container is defined
    msg: "target_container variable must be provided (e.g., -e target_container=frigate, or a list for multiple)"

# accept either a single string or a list, so existing single-container
# usage keeps working unchanged
#- name: normalize target_container into a list
#  ansible.builtin.set_fact:
#    target_containers: "{{ [target_container] if target_container is string else target_container }}"

# Step 1: Parse the string. If it's a JSON string '["a", "b"]', this converts it to a real list. 
# If it's a plain string 'frigate', it remains a string.
- name: parse target_container payload
  ansible.builtin.set_fact:
    _parsed_container: "{{ target_container | from_yaml if target_container is string else target_container }}"

# Step 2: Wrap it in a list only if it is still a string (e.g., single container)
- name: normalize target_container into a list
  ansible.builtin.set_fact:
    target_containers: "{{ [_parsed_container] if _parsed_container is string else _parsed_container }}"

# process each container name in turn, in the order given
- name: process each target container
  ansible.builtin.include_tasks: restart_container_across_repos.yaml
  loop: "{{ target_containers }}"
  loop_control:
    loop_var: container_name
