---
# =============================================================================
# docker_container_restart.yaml
#
# Restarts a single docker container on the current host by running its
# stop/start scripts from docker-homelab.
#
# See the wiki for full details. Summary:
#
# Variables:
#   target_container          (required) name of the container directory to
#                              target, e.g. -e target_container=frigate
#   docker_restart_wait_time  seconds to wait between stop and start (default 5)
#   docker_script_version     version/interface tag passed to the stop/start
#                              scripts (default v2)
#   docker_stop_script        stop script, relative to the container's
#                              directory (default ../docker-stop.sh {{ docker_script_version }})
#   docker_start_script       start script, relative to the container's
#                              directory (default ../docker-start.sh {{ docker_script_version }})
#
# How it works:
#   1. Extracts the docker-homelab repo path for this host.
#   2. Builds the container's directory:
#      {{ docker_homelab_dest }}/servers/{{ ansible_hostname }}/{{ target_container }}
#   3. Verifies the directory exists; if missing, skips this host cleanly
#      rather than failing the playbook.
#   4. Executes the stop script and logs its output.
#   5. Waits for docker_restart_wait_time using wait_for (per-host evaluation).
#   6. Executes the start script and logs its output.
#
# Note on the "../" paths: containers live in a shared folder under
# /docker/ in the docker-homelab repo, and are symlinked under each host's
# directory. That's why the stop/start scripts are referenced with a
# relative "../" path - it resolves through the symlink to the shared
# /docker/ scripts, regardless of which host is running it.
# =============================================================================

- name: ensure target_container variable is defined
  ansible.builtin.assert:
    that: target_container is defined
    msg: "target_container variable must be provided (e.g., -e target_container=frigate)"

# look through the github_repos list (defined in group_vars) and pull out
# the 'dest' path specifically for 'docker-homelab'
- name: extract docker-homelab destination path
  ansible.builtin.set_fact:
    docker_homelab_dest: "{{ (github_repos | default([]) | selectattr('name', 'equalto', 'docker-homelab') | map(attribute='dest') | first) | default('') }}"

# build the path to this container's directory for this host
# using ansible_hostname to perfectly match bash $(hostname)
- name: set container directory path
  ansible.builtin.set_fact:
    container_dir: "{{ docker_homelab_dest }}/servers/{{ ansible_hostname }}/{{ target_container }}"
  when: docker_homelab_dest != ''

# check if the specific container directory actually exists on this host
- name: check if container directory exists
  ansible.builtin.stat:
    path: "{{ container_dir }}"
  register: container_dir_stat
  when: docker_homelab_dest != ''

# single source of truth for "did we find a valid, existing container dir?"
# written carefully to avoid undefined dictionary errors if stat was skipped
- name: determine if container was found
  ansible.builtin.set_fact:
    container_found: "{{ docker_homelab_dest != '' and (container_dir_stat.stat.exists | default(false)) | bool }}"

# if the directory doesn't exist, inform the user but do not fail the playbook
- name: report missing container directory
  ansible.builtin.debug:
    msg: "container '{{ target_container }}' does not exist on host {{ ansible_hostname }}. skipping."
  when: not container_found

# block to execute the restart logic only if the directory exists.
# runs as admin_user (not the default root from play-level become) since
# that's the identity with working SSH access to the secrets host
# that docker-stop.sh/docker-start.sh call out to
- name: process container restart
  when: container_found
  become_user: "{{ admin_user }}"
  block:
    # run the stop script from within the container directory
    # command (not shell) is used since the script needs no pipes,
    # redirects, or shell expansion - just a path and an argument
    - name: execute docker stop script
      ansible.builtin.command: "{{ docker_stop_script }}"
      args:
        chdir: "{{ container_dir }}"
      register: stop_script_output
      changed_when: true

    # display the output of the stop script for debugging
    - name: display stop script output
      ansible.builtin.debug:
        var: stop_script_output.stdout_lines

    # wait the configured amount of time before starting using wait_for
    # so it evaluates correctly per-host instead of globally.
    # check_mode: false forces this to actually run even under --check -
    # wait_for refuses to run in check mode by default (it has no side
    # effects to simulate) and would otherwise silently skip, which would
    # be misread as the container not being found.
    - name: wait before starting container
      ansible.builtin.wait_for:
        timeout: "{{ docker_restart_wait_time }}"
      check_mode: false

    # run the start script from within the container directory
    - name: execute docker start script
      ansible.builtin.command: "{{ docker_start_script }}"
      args:
        chdir: "{{ container_dir }}"
      register: start_script_output
      changed_when: true

    # display the output of the start script for debugging
    - name: display start script output
      ansible.builtin.debug:
        var: start_script_output.stdout_lines
