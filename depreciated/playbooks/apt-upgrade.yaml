---
# APT Upgrade playbook
# Performs apt update and upgrade operations on Debian/Ubuntu systems
#
# Usage:
#   ansible-playbook -i inventories/local/hosts.yaml playbooks/apt-upgrade.yaml
#   ansible-playbook -i inventories/local/hosts.yaml playbooks/apt-upgrade.yaml -e apt_upgrade_strategy=full
#   ansible-playbook -i inventories/local/hosts.yaml playbooks/apt-upgrade.yaml -e "apt_upgrade_strategy=safe apt_auto_reboot=true"
#   ansible-playbook -i inventories/local/hosts.yaml playbooks/apt-upgrade.yaml -e apt_upgrade_strategy=security

- name: APT Update and Upgrade
  hosts: update_targets
  gather_facts: yes
  become: true
  environment: "{{ debian_noninteractive_env }}"

  vars_files:
    - ../group_vars/all/vault.yaml
    - ../group_vars/all/admin-user.yaml    # Admin user details
    - ../group_vars/all/ansible-user.yaml  # Override vault to use admin user

  pre_tasks:
    - name: Verify target is Debian/Ubuntu
      ansible.builtin.fail:
        msg: "This playbook only supports Debian/Ubuntu systems"
      when: ansible_facts['os_family'] != "Debian"

    - name: Display target information
      ansible.builtin.debug:
        msg:
          - "=== Target System Information ==="
          - "Host: {{ inventory_hostname }}"
          - "Distribution: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}"
          - "Architecture: {{ ansible_facts['architecture'] }}"
          - "Current time: {{ ansible_facts['date_time']['iso8601'] }}"
          - "Non-interactive mode: enabled"

  tasks:
    - name: Include apt_upgrade role
      ansible.builtin.include_role:
        name: apt_upgrade

  post_tasks:
    - name: Check for dpkg configuration conflicts
      ansible.builtin.find:
        paths: /etc
        patterns: "*.dpkg-dist"
        recurse: yes
      register: dpkg_dist_files
      become: yes

    - name: Display dpkg configuration status
      ansible.builtin.debug:
        msg: "{{ dpkg_notice if (dpkg_dist_files.files | length > 0) else 'No configuration file conflicts detected.' }}"
      vars:
        dpkg_notice:
          - "=== Configuration File Changes Detected ==="
          - "{{ dpkg_dist_files.files | length }} config files have updates available"
          - "Files: {{ dpkg_dist_files.files | map(attribute='path') | map('regex_replace', '\\.dpkg-dist$', '') | map('basename') | list }}"
          - ""
          - "To review changes later, check for .dpkg-dist files in /etc:"
          - "  find /etc -name '*.dpkg-dist' -type f"
          - "  diff /path/to/config /path/to/config.dpkg-dist"
