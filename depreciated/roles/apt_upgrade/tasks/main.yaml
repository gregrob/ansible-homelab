---
# Role to perform apt update and upgrade operations on Debian/Ubuntu systems
#
# Steps performed:
#  1. Display configuration
#  2. Update apt package cache
#  3. Check upgradable packages (optional)
#  4. Upgrade packages based on strategy
#  5. Clean package cache / autoremove (if strategy is none)
#  6. Check if system reboot is required (/var/run/reboot-required)
#  7. Reboot if required and configured
#  8. Display upgrade summary

# Display initial configuration
- name: Display apt upgrade configuration
  ansible.builtin.debug:
    msg:
      - "=== APT Upgrade Configuration ==="
      - "Upgrade strategy: {{ apt_upgrade_strategy }}"
      - "Auto remove unused packages: {{ apt_autoremove }}"
      - "Clean package cache: {{ apt_clean_cache }}"
      - "Auto reboot if required: {{ apt_auto_reboot }}"
      - "Target host: {{ inventory_hostname }}"

# Update apt package cache
- name: Update apt package cache
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: "{{ apt_cache_valid_time | default(3600) }}"
  register: apt_update_result
  become: yes

# Check upgradable packages
- name: Check upgradable packages
  ansible.builtin.command:
    cmd: apt list --upgradable
  register: upgradable_packages
  changed_when: false
  become: yes
  when: apt_show_upgradable | default(false)

# Display upgradable packages
- name: Display upgradable packages
  ansible.builtin.debug:
    msg:
      - "Packages available for upgrade:"
      - "{{ upgradable_packages.stdout_lines[1:] if (upgradable_packages.stdout_lines | default([]) | length > 1) else ['No packages to upgrade'] }}"
  when:
    - apt_show_upgradable | default(false)
    - upgradable_packages is defined

# Perform package upgrade (Consolidated safe, full, and security strategies)
- name: Perform package upgrade
  ansible.builtin.apt:
    upgrade: "{{ 'full' if apt_upgrade_strategy == 'full' else 'safe' }}"
    autoremove: "{{ apt_autoremove }}"
    autoclean: "{{ apt_clean_cache }}"
  register: apt_upgrade_result
  become: yes
  when: apt_upgrade_strategy in ['safe', 'full', 'security']

# Clean package cache if requested and strategy is 'none'
- name: Clean apt package cache
  ansible.builtin.apt:
    autoclean: yes
  become: yes
  when:
    - apt_clean_cache
    - apt_upgrade_strategy == "none"

# Remove unused packages if requested and strategy is 'none'
- name: Remove unused packages
  ansible.builtin.apt:
    autoremove: yes
  become: yes
  when:
    - apt_autoremove
    - apt_upgrade_strategy == "none"

# Check if a reboot is flagged by Debian/Ubuntu (/var/run/reboot-required)
- name: Check if reboot is required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required

# Reboot system if required and auto-reboot is enabled
- name: Reboot system if required and auto-reboot is enabled
  ansible.builtin.reboot:
    reboot_timeout: "{{ apt_reboot_timeout | default(300) }}"
    msg: "Rebooting due to package upgrades managed by Ansible"
  become: yes
  when:
    - apt_auto_reboot
    - reboot_required.stat.exists

# Display execution summary
- name: Display upgrade summary
  ansible.builtin.debug:
    msg:
      - "=== APT Upgrade Summary ==="
      - "Strategy used: {{ apt_upgrade_strategy }}"
      - "Cache updated: {{ 'Yes' if (apt_update_result is defined and apt_update_result is changed) else 'Cache was up to date' }}"
      - "Packages changed: {{ 'Yes' if (apt_upgrade_result is defined and apt_upgrade_result is changed) else 'No package changes' }}"
      - "Reboot required: {{ 'Yes' if reboot_required.stat.exists else 'No' }}"
      - "Auto-reboot performed: {{ 'Yes' if (apt_auto_reboot and reboot_required.stat.exists) else 'No' }}"
