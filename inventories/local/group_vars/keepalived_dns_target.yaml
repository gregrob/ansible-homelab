---
# Pool-wide keepalived configuration for the keepalived_dns_target group
# (dns-001, dns-002). Everything here must be identical across every node
# in the pool — VRRP/IPVS won't work correctly if nodes disagree on the
# VIP, router ID, or real server list, so these live at group level rather
# than being duplicated (and risking drift) in each host's host_vars.
#
# Per-host identity (interface, priority, this node's own IP, peer list)
# stays in host_vars — see dns-001.dns.gregrob.net.yaml / dns-002...yaml.

# Shared virtual IP — the address clients actually query. Same on every
# node; keepalived decides which node currently owns it.
keepalived_vip: 10.24.19.29/24

# All nodes start as BACKUP; keepalived_priority (set per host) decides
# which one wins the initial MASTER election, not this field.
keepalived_state: BACKUP

# Every node's own IP/CIDR in the pool. Each host's keepalived_unicast_peers
# derives from this list (everyone except itself) — see host_vars — so
# adding a node here is enough to update every existing host's peer list.
keepalived_dns_nodes:
  - 10.24.19.30/24   # dns-001
  - 10.24.19.32/24   # dns-002

# VRRP router ID. Must be unique per broadcast domain — if you run more
# than one keepalived VIP pair on the same LAN, give each pair a different
# virtual_router_id or they'll collide.
keepalived_virtual_router_id: 20

# Health check definition for this pool. Uses Technitium's dedicated
# healthCheck API rather than a real DNS query - per Technitium's own
# documentation, this endpoint checks that the server process is running
# AND able to resolve names, WITHOUT generating a query-log entry (a real
# `dig` query does log, and at check-interval frequency across both the
# self-check and every real-server MISC_CHECK, that added up to hundreds
# of thousands of log entries/day of pure noise before this was found).
#
# ${TARGET} and ${TOKEN} are set by check.sh.j2 itself from the generic
# keepalived_check_self_target / keepalived_check_extra_arg vars (role
# defaults) - TARGET is 127.0.0.1 for the VRRP self-check or a specific
# pool member's IP for IPVS MISC_CHECK; TOKEN carries this DNS pool's
# Technitium API token specifically (see keepalived_check_extra_arg in
# host_vars, and keepalived_real_server_extra_args, derived per-host in
# tasks/main.yaml). Both must be referenced here, not hardcoded, or every
# check would silently test the wrong node/credential.
#
# --max-time is required, not optional: a frozen/paused container can
# still accept the TCP connection via Docker's port-forwarding layer even
# when the application itself isn't responding, so a request with no
# timeout hangs indefinitely rather than failing - confirmed directly via
# testing. grep pattern is loose (no exact-whitespace assumption) since
# the API's JSON formatting isn't guaranteed byte-for-byte stable.
#
# These are DNS-specific, not role defaults — reuse this role for a
# non-DNS service (e.g. Traefik) by defining your own version of this var
# in that group's vars instead.
keepalived_check_command: "/usr/bin/curl -sf --max-time {{ keepalived_check_timeout }} \"http://${TARGET}:5380/api/dnsClient/healthCheck?token=${TOKEN}\" | grep -Eq '\"status\"[[:space:]]*:[[:space:]]*\"ok\"'"

# ---------------------------------------------------------------------------
# IPVS load balancing — distributes VIP traffic across both dns-001 and
# dns-002 rather than only whichever one currently holds the VIP, using
# LVS-DR mode so the responding node answers the client directly (no
# proxying, real client source IP preserved). A node that fails its own
# DNS health check is pulled from rotation independently of VRRP/VIP
# ownership. See roles/keepalived/tasks/main.yaml for the supporting
# sysctl/kernel-module/loopback-binding setup this enables.
keepalived_load_balancer_enabled: true

keepalived_real_servers:
  - ip: 10.24.19.30   # dns-001
    weight: 10
  - ip: 10.24.19.32   # dns-002
    weight: 10

# Inventory group containing every node in this pool - used to derive
# peer MAC addresses for the loop-prevention mangle rules (see
# roles/keepalived/tasks/main.yaml). Must match the inventory group name
# actually used for this play's hosts: - see inventories/local/hosts.yaml.
keepalived_inventory_group: keepalived_dns_target
