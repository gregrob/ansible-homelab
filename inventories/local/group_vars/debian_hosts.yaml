---
# =====================================================================
# Debian Host Configuration (Connection, Escalation, & Identity)
# =====================================================================

# 1. Single Source of Truth for the admin identity
admin_user: admin
admin_group: admin

# 2. Connection Settings (inheriting from our identity variable)
ansible_user: "{{ admin_user }}"
ansible_ssh_private_key_file: ~/.ssh/id_ed25519_ansible_controller

# 3. Privilege Escalation Settings
ansible_become_method: sudo
ansible_become_password: "{{ debian_admin_password }}"
