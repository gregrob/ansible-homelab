--- 
# -----------------------------------------------------------------
# Host-specific variables for development-003.apps.gregrob.net.yaml
# -----------------------------------------------------------------

# Target type
target_type: vm

# Domain settings
domain_root: gregrob.net
domain_sub_prefix: apps
domain_hostname: development-003

# Network settings
network_interfaces:
  - name: ens18
    id: primary
    address: 10.24.4.74
    netmask: 255.255.255.0
    gateway: "{{ gateway_ip_apps }}"
    dns_nameservers: "{{ dns_servers_internal }}"
    dns_search: "{{ domain_sub_prefix }}.{{ domain_root }} {{ domain_root }}"
    purpose: "primary interface for all traffic"
    firewalled: false

  - name: ens19
    id: storage
    address: 192.168.1.95
    netmask: 255.255.255.0
    purpose: "dedicated interface for direct nas storage traffic"
    firewalled: true
    allowed_ips:
      - "{{ nas_backbone_ip }}"

# List of NFS shares to mount with their corresponding local mount points
nfs_mounts:
  - share: /volume1/server-mounts/application/development
    mountpoint: development
    mode: rw
