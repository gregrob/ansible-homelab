--- 
# ----------------------------------------------------------
# Host-specific variables for downloads-001.apps.gregrob.net
# ----------------------------------------------------------

# Target type
target_type: vm

# Domain settings
domain_root: gregrob.net
domain_sub_prefix: apps
domain_hostname: download-001

# Network settings
network_interfaces:
  - name: ens18
    id: primary
    address: 10.24.4.69
    netmask: 255.255.255.0
    gateway: "{{ gateway_ip_apps }}"
    dns_nameservers: "{{ dns_servers_internal }}"
    dns_search: "{{ domain_sub_prefix }}.{{ domain_root }} {{ domain_root }}"
    purpose: "primary interface for all traffic"
    firewalled: false

  - name: ens19
    id: storage
    address: 192.168.1.94
    netmask: 255.255.255.0
    purpose: "dedicated interface for direct nas storage traffic"
    firewalled: true
    allowed_ips:
      - "{{ nas_backbone_ip }}"

# List of NFS shares to mount with their corresponding local mount points
nfs_mounts:
  - share: /volume1/downloads
    mountpoint: downloads
    mode: rw
  - share: /volume1/server-mounts
    mountpoint: server-mounts
    mode: rw
  - share: /volume1/media/video/tv
    mountpoint: media/tv
    mode: rw # so files can be automatically moved into place
