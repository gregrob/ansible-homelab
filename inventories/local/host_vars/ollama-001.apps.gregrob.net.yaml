--- 
# -------------------------------------------------------
# Host-specific variables for ollama-001.apps.gregrob.net
# -------------------------------------------------------

# Target type
target_type: lxc

# Domain settings
domain_root: gregrob.net
domain_sub_prefix: apps
domain_hostname: ollama-001

# Network settings
network_interfaces:
  - name: eth0
    id: primary
    address: 10.24.4.70
    netmask: 255.255.255.0
    gateway: "{{ gateway_ip_apps }}"
    dns_nameservers: "{{ dns_servers_internal }}"
    dns_search: "{{ domain_sub_prefix }}.{{ domain_root }} {{ domain_root }}"
    purpose: "primary interface for all traffic"
    firewalled: false

# NFS shares to be mounted. NOTE: For LXCs, these entries are for reference
# only — the actual mount points are defined via bind mounts in the
# Proxmox host's LXC .conf, not by this role.
nfs_mounts:
  - share: server-mounts/application/ollama
    mountpoint: ollama
    mode: rw
