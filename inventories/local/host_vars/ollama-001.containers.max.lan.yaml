--- 
# Host-specific variables for ollama-001.containers.max.lan

# LXC
is_lxc: true

# Network configuration settings specific to this target host

# Frontend network configuration (main LAN/WAN connection)
frontend_gateway: "{{ gateway_ip_containers }}"  # Default gateway for internet access
frontend_interface: eth0                         # Network interface name for frontend connection
frontend_address: 10.24.4.70                     # Static IP address for frontend interface

# Backbone network configuration (internal/storage network)
backbone_interface: none                         # Network interface name for backbone connection
backbone_address: 0.0.0.0                        # Static IP address for backbone interface
