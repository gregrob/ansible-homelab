---
# ---------------------------------------------------------
# Host-specific variables for nut-002.mgmt.gregrob.net.yaml
# ---------------------------------------------------------
#
# Single physical NIC trunking multiple VLANs, so this host defines
# network_interfaces directly. Add further VLAN sub-interfaces below as this
# node picks up other backup roles.
#
# NetworkManager -> ifupdown migration for this host is a two-phase,
# explicit-opt-in process (neither runs on a normal playbook run):
#
#   1. ansible-playbook configure-network.yaml --limit nut-002.mgmt.gregrob.net \
#        --tags raspberrypi_bootstrap
#      Installs ifupdown, deploys this config, reboots once, verifies.
#      Does NOT touch NetworkManager live - only disables it for the
#      next boot. Confirm SSH is stable from a second terminal after
#      this completes before proceeding.
#
#   2. ansible-playbook configure-network.yaml --limit nut-002.mgmt.gregrob.net \
#        --tags raspberrypi_cleanup -e confirm_pi_network_cleanup=true
#      Purges NetworkManager/dhcpcd. Only run after independently
#      confirming step 1 worked.
#
# See network_config/tasks/raspberrypi_network_stack_bootstrap.yml and
# raspberrypi_network_stack_cleanup.yml for the full safety design.

# Target type
target_type: rpi

# Leave false unless you want cloud-init fully removed rather than just
# stopped from touching networking - see role defaults for details.
raspberry_pi_purge_cloud_init: false

# Domain settings
domain_root: gregrob.net
domain_sub_prefix: mgmt
domain_hostname: nut-002

# Network settings
# Define the following settings this way to prevent lazy evaluation with jinja2
# expressions in the keepalived vars
network_frontend_ip: "10.24.2.102"
network_all_interface: "eth0"

# Network settings
network_interfaces:
  # Physical trunk - carries all tagged VLANs below, no IP of its own
  - name: "{{ network_all_interface }}"
    id: trunk
    purpose: "physical trunk interface for vlan tagging (no direct ip traffic)"

  # Tagged VLAN sub-interface
  - name: "{{ network_all_interface }}.{{ mgmt_vlan_id }}"
    id: primary
    parent: "{{ network_all_interface }}"
    vlan_id: "{{ mgmt_vlan_id }}"
    address: "{{ network_frontend_ip }}"
    netmask: 255.255.255.0
    gateway: "{{ gateway_ip_mgmt }}"
    dns_nameservers: "{{ dns_servers_internal_technitium }}"
    dns_search: "{{ domain_sub_prefix }}.{{ domain_root }} {{ domain_root }}"
    purpose: "primary interface for all traffic"
    firewalled: false

# No NFS shares needed on this node
nfs_mounts: []

# Packages installed by the packages role. 'nut' is Debian's metapackage that
# pulls in nut-server and nut-client, which the nut_server role expects.
# 'apache2' and 'nut-cgi' are for the nut web interface.
specific_packages:
  - nut
  - apache2
  - nut-cgi

# =========================================================
# NUT server (nut_server role, configure-nut-server.yaml)
# =========================================================
# Secrets come from the vault: nut_server_admin_password,
# nut_server_observer_password, nut_server_webadmin_password and
# nut_server_hauser_password.

# Interlock flag: configure-nut-server.yaml refuses to run on any host without it
is_nut_server: true

# UPS devices served by this host (rendered into ups.conf).
# Currently a dummy device for testing (edit /etc/nut/dummy.dev on the server
# to simulate events). Replace it with the real UPS at cutover, e.g.:
#   - name: cyberpower-cluster
#     driver: usbhid-ups      # assumed: copy driver/port from nut-001's /etc/nut/ups.conf
#     port: auto
#     desc: "CyberPower UPS"
nut_server_ups:
  - name: dummy
    driver: dummy-ups
    port: /etc/nut/dummy.dev
    desc: "Dummy test UPS"

# Extra upsd users beyond the core admin / observer / webadmin set.
# Fields: name, password, desc, actions, instcmds, upsmon (see role defaults).
nut_server_extra_users:
  - name: hauser
    password: "{{ nut_server_hauser_password }}"
    desc:
      - Home Assistant integration user
      - Lets Home Assistant monitor UPS status AND trigger battery tests
    instcmds: [all]

# =========================================================
# NUT web interface (setup_nut_web.yml, needs apache2 + nut-cgi above)
# =========================================================
# Who may use the NUT web pages: internal networks only. Each entry is an
# Apache 'Require' rule and any match grants access. The role default is
# "all granted", so this host must narrow it; the role refuses to enable the
# admin page (below) while access is still open to everyone.
nut_server_web_require:
  - ip 192.168.0.0/16
  - ip 10.24.0.0/16
 
# Enable upsset.cgi, the web admin page (logs in with the webadmin user).
# The role default is false. Safe to turn on here because access is restricted
# to the networks above.
nut_server_web_upsset_enabled: true
