--- 
# Host-specific variables for dns-002.dns.gregrob.net
# Network configuration settings specific to this target host

# Frontend network configuration (main LAN/WAN connection)
frontend_gateway: "{{ gateway_ip_dns }}"          # Default gateway for internet access
frontend_interface: ens18                         # Network interface name for frontend connection
frontend_address: 10.24.19.32                     # Static IP address for frontend interface
frontend_dns_search: "dns.gregrob.net gregrob.net"

# No backbone on this VM
backbone_enabled: false

# No NFS shares needed on this VM
nfs_mounts: []

# VM
is_lxc: false

# Keepalived settings
keepalived_instance_name: vrrp_dns_002
keepalived_interface: "{{ frontend_interface }}"
keepalived_priority: 100
keepalived_unicast_src_ip: "{{ frontend_address }}/24"
keepalived_unicast_peers: "{{ keepalived_dns_nodes | reject('equalto', keepalived_unicast_src_ip) | list }}"
keepalived_technitium_api_token: "{{ keepalived_technitium_api_token_dnsc }}"
