--- 
# ----------------------------------------------------------
# Host-specific variables for atlantis.mgmt.gregrob.net
# ----------------------------------------------------------

# nut client for automatic shutdown
is_nut_client: true

# nut client is a proxmox host (part of cluster)
nut_client_proxmox_enabled: true

# Packages installed by the packages role. 'nut-client' provides upsmon and upsc,
# which is all a NUT client needs (no driver, no upsd, no web interface).
# 'jq' is needed only on Proxmox nodes: the NUT shutdown script uses it to parse
# the pvesh JSON when listing the guests to stop. The nut_client role refuses to
# run on a node without it.
# CURRENTLY THIS NEEDS TO BE MANUALLY HANDLED
specific_packages:
  - nut-client
  - jq
