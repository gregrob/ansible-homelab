[defaults]
inventory = ./inventories/local/hosts.yaml
roles_path = ./roles
vault_password_file = ./.ansible_vault_pass.txt
host_key_checking = False
stdout_callback = default
result_format = yaml

# Directory containing custom or repository-specific callback plugins
callback_plugins = ./callback_plugins

# Enable custom callbacks for end-of-run summaries.
# '10_warning_summary' groups warnings/deprecations, and '20_changed_summary' groups changed tasks.
# The numeric prefixes ensure plugins load in order so the changed summary always prints last.
callbacks_enabled = 10_warning_summary, 20_changed_summary

# Make sure --diff is default so we can always see what has changed in a run.
# This may expose secrets in the diff.
[diff]
always = yes
