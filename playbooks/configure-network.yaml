---
# Configure network interfaces playbook
# Sets up static IP(s), DNS, VLANs, and optional per-interface firewall rules.
# Covers VM, LXC, and Raspberry Pi targets - see network_config role defaults
# for the network_interfaces / legacy frontend+backbone variable shapes.
#
# Usage:
#   ansible-playbook -i inventories/local/hosts.yaml configure-network.yaml --ask-vault-pass
#
#   To target a single host instead of the whole network_config_target
#   group, add --limit - useful for testing one host, rolling changes out
#   incrementally rather than fleet-wide, or onboarding a new host for
#   the first time (add it to network_config_target in inventory first,
#   then --limit it on its own before letting future runs cover it as
#   part of the full group):
#
#     ansible-playbook -i inventories/local/hosts.yaml configure-network.yaml \
#       --limit dns-001.dns.gregrob.net --ask-vault-pass
#
# WARNING: This playbook restarts networking on the target host.
#          Ensure you have console access (Proxmox console, or physical/UART
#          access for a Raspberry Pi) before continuing.
#
#          For clean / uninterrupted access, temporarily add the static IP to the 
#          adapter first. 
#
#          For a standard interface:
#            e.g. sudo ip addr add 10.24.4.X/24 dev ens18
#
#          For a VLAN interface (e.g., VLAN 2 on eth0):
#            1. sudo ip link add link eth0 name eth0.2 type vlan id 2
#            2. sudo ip link set dev eth0.2 up
#            3. sudo ip addr add 10.24.2.X/24 dev eth0.2

- name: Configure network interfaces
  hosts: network_config_target
  gather_facts: yes
  become: yes

  vars_files:
    - ../group_vars/all/vault.yaml 
    - ../group_vars/all/topology.yaml    
    - ../group_vars/all/nas.yaml

  pre_tasks:
    - name: Ensure target_type is a valid enum value
      ansible.builtin.assert:
        that:
          - (target_type | default('none')) in ['vm', 'lxc', 'rpi']
        fail_msg: >-
          'target_type' is missing or invalid on {{ inventory_hostname }} (currently: '{{ target_type | default('undefined') }}').
          Please set 'target_type' to 'vm', 'lxc', or 'rpi' in host_vars/{{ inventory_hostname }}.yaml.

    # ───────────────────────────────────────────────────────────────────────
    # LXC Bypass Check
    # LXC network, hostname, and DNS settings are managed centrally via the
    # Proxmox GUI / API (container config) rather than guest network interfaces.
    # ───────────────────────────────────────────────────────────────────────
    - name: Check if target is an LXC container
      when: (target_type | default('none')) == 'lxc'
      block:
        - name: Explain LXC network management policy
          ansible.builtin.debug:
            msg:
              - "┌──────────────────────────────────────────────────────────────┐"
              - "│                  LXC Host Skipped                            │"
              - "├──────────────────────────────────────────────────────────────┤"
              - "│ {{ inventory_hostname }} is flagged as an LXC container.       │"
              - "│                                                              │"
              - "│ Network interfaces, static IPs, hostnames, and DNS search    │"
              - "│ paths for LXC containers are managed directly within the    │"
              - "│ Proxmox VE GUI/API (Container -> Network / DNS).             │"
              - "│                                                              │"
              - "│ Skipping in-guest network configuration.                     │"
              - "└──────────────────────────────────────────────────────────────┘"

        # network_interfaces on an LXC host is a documentation mirror only
        # (see the host's own host_vars comment) - it's not applied here,
        # but the values are exactly what need to be punched into Proxmox's
        # Container -> Network tab (or `pct set`) by hand. IP/gateway are
        # per-NIC in Proxmox's model (net0, net1, ...); nameserver/search
        # are set once at the container level, not per-interface - called
        # out separately below so this doesn't imply a 1:1 mapping that
        # doesn't exist in Proxmox.
        - name: Show the Proxmox net0/net1/... values this host's documentation expects
          ansible.builtin.debug:
            msg: >-
              [{{ inventory_hostname }}] net{{ loop_index }} ({{ item.purpose | default('no purpose set') }}):
              ip={{ item.address | default('DHCP/manual, no static IP') }}{{ ' netmask=' ~ item.netmask if item.netmask is defined else '' }}
              {{ 'gw=' ~ item.gateway if item.gateway is defined else '(no gateway on this interface)' }}
          loop: "{{ network_interfaces }}"
          loop_control:
            index_var: loop_index
            label: "{{ item.name }}"

        - name: Show the Proxmox container-level DNS settings this host's documentation expects
          ansible.builtin.debug:
            msg:
              - "[{{ inventory_hostname }}] Proxmox container-level DNS (not per-interface - set once via"
              - "Container -> DNS, or 'pct set <vmid> --nameserver ... --searchdomain ...'):"
              - "  nameserver  : {{ (network_interfaces | selectattr('dns_nameservers', 'defined') | map(attribute='dns_nameservers') | list | first) | default('not set on any interface in host_vars') }}"
              - "  searchdomain: {{ (network_interfaces | selectattr('dns_search', 'defined') | map(attribute='dns_search') | list | first) | default('not set on any interface in host_vars') }}"

        - name: End host execution gracefully for LXC
          ansible.builtin.meta: end_host

    - name: display network configuration warning
      ansible.builtin.debug:
        msg:
          - "┌──────────────────────────────────────────────────────────────┐"
          - "│              Network Configuration Warning                   │"
          - "│                                                              │"
          - "│ This playbook will restart networking on the target host.    │"
          - "│ SSH connectivity may be lost if IP settings are incorrect.   │"
          - "│                                                              │"
          - "│ Ensure you have console access before continuing.            │"
          - "└──────────────────────────────────────────────────────────────┘"
          - "Target Host : {{ inventory_hostname }} (SSH: {{ ansible_host }})"
          - "Hostname    : {{ domain_hostname }}"
          - "FQDN        : {{ domain_hostname }}.{{ domain_sub_prefix }}.{{ domain_root }}"
          - "Subdomain   : {{ domain_sub_prefix }}.{{ domain_root }}"
          - "Root Domain : {{ domain_root }}"
          - "Target Type : {{ target_type }}"

    - name: display network interfaces configured for this host
      ansible.builtin.debug:
        msg: "{{ '%-16s -> %-15s  (%s)%s' | format(item.name, item.address | default('no IP (manual)'), item.purpose | default('no purpose set'), item.vlan_id is defined and (' vlan ' ~ item.vlan_id) or '') }}"
      loop: "{{ network_interfaces }}"
      loop_control:
        label: "{{ item.name }}"

    - name: display firewalled interface allow-lists
      ansible.builtin.debug:
        msg: "{{ item.0.name }} allows: {{ item.1 }}"
      loop: "{{ network_interfaces | subelements('allowed_ips', skip_missing=True) }}"
      loop_control:
        label: "{{ item.0.name }} <- {{ item.1 }}"
      when: item.0.firewalled | default(false)

    - name: wait for confirmation to proceed
      ansible.builtin.pause:
        prompt: "Press Enter to continue or Ctrl+C then A to abort."
      when: not (skip_confirmation | default(false) | bool)

  roles:
    - network_config
