---
# Secrets Server Encryption and Backup Playbook
# Performs a two-step workflow on the secrets server:
#   1. Encrypts sensitive host data (./encrypt-secrets.sh)
#   2. Pushes encrypted backups to FlashStor (./backup-secrets.sh)
#
# Usage:
#   ansible-playbook -i inventories/local/hosts.yaml playbooks/secrets-execute.yaml --ask-vault-pass

- name: Encrypt and Backup Secrets Server
  hosts: secrets_targets
  gather_facts: yes
  become: false

  vars_files:
    - ../group_vars/all/vault.yaml
    - ../group_vars/all/admin-user.yaml
    - ../group_vars/all/ansible-user.yaml  # Ensures admin/ansible user overrides vault defaults

  vars:
    secrets_commands:
      - name: "Encrypt secrets"
        cmd: "./encrypt-secrets.sh"
      - name: "Backup secrets"
        cmd: "./backup-secrets.sh"
        environment:
          SSHPASS: "{{ flashstor_admin_password }}"
        no_log: true

  tasks:
    - name: Run secrets backup sequence
      ansible.builtin.include_role:
        name: secrets_execute
  