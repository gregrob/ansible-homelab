---
# Secrets Server Encryption and Backup Playbook
# Performs a two-step workflow on the secrets server:
#   1. Encrypts sensitive host data (./encrypt-secrets.sh)
#   2. Archives the secrets store and SSH keys, encrypts the archive with gpg
#      (passphrase from backup_encryption_passphrase), and pushes it to FlashStor
#      (./backup-secrets.sh)
#
# Usage:
#   ansible-playbook -i inventories/local/hosts.yaml playbooks/secrets-execute.yaml --ask-vault-pass

- name: Encrypt and Backup Secrets Server
  hosts: secrets_target
  gather_facts: yes
  become: false

  vars_files:
    - ../group_vars/all/vault.yaml                 # Secrets
    - ../group_vars/all/admin-user.yaml            # Consistent admin user for all these machines
    - ../group_vars/all/secrets-homelab-paths.yaml # Paths used in the secret server
    - ../group_vars/all/ansible-user.yaml          # Ensures admin/ansible user overrides vault defaults

  vars:
    secrets_commands:
      - name: "Encrypt secrets"
        cmd: "./encrypt-secrets.sh"
      - name: "Backup secrets"
        cmd: "./backup-secrets.sh"
        environment:
          SSHPASS: "{{ flashstor_admin_password }}"
          BACKUP_PASS: "{{ backup_encryption_passphrase }}"
        no_log: true

  tasks:
    - name: Run secrets backup sequence
      ansible.builtin.include_role:
        name: secrets_execute
  