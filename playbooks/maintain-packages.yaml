---
# System Update Playbook
# Applies package updates, ensures core tools exist, handles service restarts,
# and reboots nodes if a new kernel is active (safely skipping LXCs).
#
# Usage:
#   ansible-playbook playbooks/system-update.yaml
#   ansible-playbook playbooks/system-update.yaml --limit '!ansible-002.mgmt.gregrob.net'

- name: Perform System Maintenance and Package Updates
  hosts: debian_config_target
  gather_facts: yes
  become: yes

  vars_files:
    - ../group_vars/all/vault.yaml

  pre_tasks:
    - name: Validate target hardware type
      ansible.builtin.import_role:
        name: common
        tasks_from: validate_target_type

  roles:
    - { role: packages, tags: [base] }
