---
# Configure NUT Server
#
# Sets up the NUT (Network UPS Tools) server: the host that talks to the UPS
# and serves its status to NUT clients over TCP 3493, plus the NUT web interface
# (apache2 + nut-cgi, installed by the packages role).
#
# UPS devices are defined per host in host_vars via nut_server_ups. For testing
# without hardware, use the dummy driver:
#   nut_server_ups:
#     - name: dummy
#       driver: dummy-ups
#       port: /etc/nut/dummy.dev
#       desc: "Dummy test UPS"
#
# Usage:
#   ansible-playbook -i inventories/local/hosts.yaml playbooks/configure-nut-server.yaml --ask-vault-pass
#
# To skip the interactive confirmation pause (e.g. running from an Ansible
# GUI/runner with no interactive terminal to press Enter in), pass:
#   -e skip_confirmation=true

- name: Configure NUT Server
  hosts: nut_server_target
  gather_facts: yes

  vars_files:
    - ../group_vars/all/vault.yaml                 # Provides the nut_server_*_password secrets

  pre_tasks:
    # 1. The Safety Interlock
    - name: SAFETY INTERLOCK - Verify target is the designated NUT server
      ansible.builtin.assert:
        that:
          - is_nut_server | default(false) | bool
        fail_msg: >-
          Aborting execution!
          This host ({{ inventory_hostname }}) is NOT flagged as the NUT server.
          Expected 'is_nut_server: true' in host_vars.
        success_msg: "Interlock passed: Target is verified as the designated NUT server."

    # 2. Display target-specific info
    - name: Display playbook setup guide
      ansible.builtin.debug:
        msg: |
          ┌───────────────────────────────────────────────────────────┐
          │                 NUT SERVER SETUP                          │
          └───────────────────────────────────────────────────────────┘
          Target Host : {{ inventory_hostname }}
          Role        : nut_server
          Status      : Verified as NUT Server (is_nut_server=true)
          UPS devices : {{ nut_server_ups | default([]) | map(attribute='name') | join(', ') }}

          NOTE: The server is the UPS primary. A shutdown event on this host (low battery / FSD) will also shut down all NUT clients.

    # 3. Confirmation gate
    - name: Wait for confirmation to proceed
      ansible.builtin.pause:
        prompt: "Press Enter to continue, or Ctrl+C to abort..."
      when: not (skip_confirmation | default(false) | bool)

  roles:
    - { role: nut_server, tags: [nut], become: true }
