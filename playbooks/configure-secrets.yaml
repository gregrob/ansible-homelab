---
# Configure Secrets Server
#
# Sets up the centralised secrets management server, including the dedicated 
# service account, strict permissions, and key management.
#
# Usage:
#   ansible-playbook -i inventories/local/hosts.yaml playbooks/configure-secrets.yaml --ask-vault-pass
#
# To skip the interactive confirmation pause (e.g. running from an Ansible
# GUI/runner with no interactive terminal to press Enter in), pass:
#   -e skip_confirmation=true

- name: Configure Secrets Machine
  hosts: secrets_target
  gather_facts: yes
  become: yes

  vars_files:
    - ../group_vars/all/vault.yaml
    - ../group_vars/all/nas.yaml                   # NAS details
    - ../group_vars/all/admin-user.yaml            # Loads admin user variables
    - ../group_vars/all/secrets-homelab-paths.yaml # Paths used in the secret server

  pre_tasks:
    # 1. The Security Interlock
    - name: SECURITY INTERLOCK - Verify target is the designated secrets server
      ansible.builtin.assert:
        that:
          - is_secrets_server | default(false) | bool
        fail_msg: >-
          SECURITY VIOLATION: Aborting execution! 
          This host ({{ inventory_hostname }}) is NOT flagged as the secrets server. 
          Expected 'is_secrets_server: true' in host_vars.
        success_msg: "Interlock passed: Target is verified as the authorized secrets server."

    # 2. Display target-specific info
    - name: Display playbook setup guide
      ansible.builtin.debug:
        msg: |
          ┌───────────────────────────────────────────────────────────┐
          │         SECURITY INTERLOCK: SECRETS SERVER SETUP          │
          └───────────────────────────────────────────────────────────┘
          Target Host : {{ inventory_hostname }}
          Role        : secrets_setup
          Status      : Verified as Secrets Server (is_secrets_server=true)

          WARNING: This execution will modify sensitive system 
          permissions, service accounts, and encryption key access.

    # 3. Confirmation gate
    - name: Wait for confirmation to proceed
      ansible.builtin.pause:
        prompt: "Press Enter to continue, or Ctrl+C to abort..."
      when: not (skip_confirmation | default(false) | bool)

  roles:
    - { role: secrets_setup,   tags: [secrets] }
    - { role: secrets_connect, tags: [secrets] }
  