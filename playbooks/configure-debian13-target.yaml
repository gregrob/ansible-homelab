---
# Configure Debian 13 VM or LXC - common base playbook
# Sets up a complete production Debian 13 VM or LXC: system configuration,
# user setup, Git/GitHub access, and Docker installation.
#
# Usage:
#   ansible-playbook -i inventories/local/hosts.yaml playbooks/configure-debian13-target.yaml --ask-vault-pass
#
#   To skip the pre-flight guide's confirmation pause (info banner still
#   displays either way):
#     ansible-playbook -i inventories/local/hosts.yaml playbooks/configure-debian13-target.yaml \
#       --ask-vault-pass -e skip_confirmation=true

- name: Configure a Debian 13 VM or LXC
  hosts: debian_config_target, configure_target
  gather_facts: yes
  become: yes
  
  vars_files:
    - ../group_vars/all/vault.yaml
    - ../group_vars/all/github-user.yaml
    - ../group_vars/all/github-repos-docker.yaml
    - ../group_vars/all/nas.yaml
    - ../group_vars/all/admin-user.yaml # Consistent admin user for all these machines
    - ../group_vars/all/topology.yaml   # gateway_ip_dns and friends - needed to resolve network_interfaces-derived vars below
    
  vars:

    admin_supplementary_groups:
      - adm             # read system logs in /var/log
      - sudo            # execute commands as root via sudo
      - netdev          # manage network interfaces without sudo
      - systemd-journal # read systemd journal logs via journalctl without sudo
      
    specific_packages:
      - nfs-common        # NFS client utilities (i.e. mount in nfs_mounts role)
      - qemu-guest-agent  # QEMU guest agent for Proxmox integration
      
  pre_tasks:
    # network_interfaces is required - the legacy frontend_*/backbone_*
    # format is no longer supported by this playbook. Fails loudly and
    # immediately rather than silently falling back, so a not-yet-migrated
    # host (e.g. download-001) can't slip through unnoticed - migrate its
    # host_vars to network_interfaces (see
    # roles/network_config/defaults/main.yaml for the schema) before
    # running this playbook against it again.
    - name: fail if this host is still using the deprecated legacy frontend_*/backbone_* var format
      ansible.builtin.assert:
        that:
          - network_interfaces is defined
        fail_msg: >-
          {{ inventory_hostname }} does not define network_interfaces.
          The legacy frontend_*/backbone_* vars are no longer supported
          by this playbook - migrate this host's host_vars to
          network_interfaces before running this playbook again.

    # Display comprehensive setup guide with target info and pre-flight checklist
    - name: display playbook setup guide (vm)
      ansible.builtin.debug:
        msg:
          - "┌───────────────────────────────────────────────────────────┐"
          - "│        Configure Debian 13 VM - Setup Guide               │"
          - "└───────────────────────────────────────────────────────────┘"
          - ""
          - "── Target ─────────────────────────────────────────────────────"
          - "  Host      : {{ inventory_hostname }}"
          - "  IP        : {{ ansible_host }}"
          - ""
          - "── VM settings ─────────────────────────────────────────────────"
          - "  System:"
          - "    - Graphics card: VirtIO-GPU (for better performance and compatibility)"
          - "    - Machine: q35 (modern hardware support - pcie)"
          - "    - BIOS: OVMF (UEFI) (for modern firmware features and better hardware compatibility)"
          - "    - Qemu Agent: enabled (for improved VM management and integration with host)"
          - "  Disk:"
          - "    - Size: 16GB (sufficient for OS and Docker, adjust if needed)"
          - "    - Cache: Write through (improves read performance)"
          - "    - Discard: on (enable trim support for better performance and space management nvme)"
          - "    - SSD emulation: on (improves performance for virtual disks with nvme)"
          - "    - For the LVM leave 50% unallocated for snapshots and future expansion"
          - "  CPU:"
          - "    - Cores: 2 (adjust based on host capabilities and workload requirements)"
          - "    - Memory: 4GB (adjust based on host capabilities and workload requirements)"
          - "    - Type: x86-64-v2-AES (modern CPU features for better performance, adjust if needed - i.e. host)"
          - "    - Ballooning Device: disabled (for consistent performance with docker workloads)"
          - "    - Allow KSM: disabled (save scanning overhead for a VM with docker workloads that may not benefit from KSM)"
          - "  Other:"
          - "    - Make sure a VirtIO RNG device is added to the VM for better entropy and performance /dev/urandom"
          - "    - Use local time for RTC: no (linux expects UTC on the hardware clock and handles timezone in the OS via timedatectl)"
          - ""
          - "── Pre-flight Checklist ────────────────────────────────────────"
          - "  1. Vault password available"
          - "  2. SSH key access to target host confirmed (installed under root)"
          - "  3. Network configured with configure-network playbook"
          - "     (see interface list below for this host's actual configuration)"
          - "  4. NFS shares exported on NAS with the appropriate interface(s) permitted"
          - "  5. GitHub deploy keys configured for required repositories"
          - "  6. Secrets server accessible from target host"
          - ""
          - "── Roles to be applied ─────────────────────────────────────────"
          - "  - packages       : update system and install common packages"
          - "  - timezone       : configure system timezone"
          - "  - admin_user     : create admin user with SSH access"
          - "  - git_setup      : configure git and GitHub SSH key"
          - "  - docker_setup   : install and configure Docker"
          - "  - nfs_mounts     : configure NFS mounts for media and shares"
          - "  - github_clone   : clone GitHub repositories"
          - "  - secrets_connect: setup secrets server SSH connection"
          - ""
          - "──────────────────────────────────────────────────────────────"
      when: not is_lxc

    - name: display playbook setup guide (lxc)
      ansible.builtin.debug:
        msg:
          - "┌───────────────────────────────────────────────────────────┐"
          - "│        Configure Debian 13 LXC - Setup Guide              │"
          - "└───────────────────────────────────────────────────────────┘"
          - ""
          - "── Target ─────────────────────────────────────────────────────"
          - "  Host      : {{ inventory_hostname }}"
          - "  IP        : {{ ansible_host }}"
          - ""
          - "── LXC settings ───────────────────────────────────────────────"
          - "  - fuse = 1"
          - "  - nesting = 1"
          - ""
          - "── Pre-flight Checklist ────────────────────────────────────────"
          - "  1. Vault password available"
          - "  2. SSH key access to target host confirmed (installed under root)"
          - "  3. GitHub deploy keys configured for required repositories"
          - "  4. Secrets server accessible from target host"
          - ""
          - "── Roles to be applied ─────────────────────────────────────────"
          - "  - disable_systemd_networkd : disable systemd-networkd for LXC"
          - "  - packages                 : update system and install common packages"
          - "  - timezone                 : configure system timezone"
          - "  - admin_user               : create admin user with SSH access"
          - "  - git_setup                : configure git and GitHub SSH key"
          - "  - docker_setup             : install and configure Docker"
          - "  - lxc_share_user           : configure shared folder access for LXC"
          - "  - github_clone             : clone GitHub repositories"
          - "  - secrets_connect          : setup secrets server SSH connection"
          - ""
          - "──────────────────────────────────────────────────────────────"
      when: is_lxc

    - name: display network interfaces configured for this host
      ansible.builtin.debug:
        msg: "{{ '%-16s -> %-15s  (%s)%s' | format(item.name, item.address | default('no IP (manual)'), item.purpose | default('no purpose set'), item.vlan_id is defined and (' vlan ' ~ item.vlan_id) or '') }}"
      loop: "{{ network_interfaces }}"
      loop_control:
        label: "{{ item.name }}"

    - name: display firewalled interface allow-lists
      ansible.builtin.debug:
        msg: "{{ item.0.name }} allows: {{ item.1 }}"
      loop: "{{ network_interfaces | subelements('allowed_ips', skip_missing=True) }}"
      loop_control:
        label: "{{ item.0.name }} <- {{ item.1 }}"

    # Pause for user confirmation before proceeding with role execution.
    # Matches configure-network.yaml / keepalived playbook convention: the
    # guide above always displays, only the pause itself is skippable.
    - name: wait for confirmation to proceed
      ansible.builtin.pause:
        prompt: "Press Enter to continue..."
      when: not (skip_confirmation | default(false) | bool)

  roles:
    # LXC only
    - { role: disable_systemd_networkd, tags: [base],    when: is_lxc }     # lxc uses ifupdown, not systemd-networkd

    - { role: packages,                 tags: [base] }                      # update system and install common packages
    - { role: timezone,                 tags: [base] }                      # configure system timezone
    - { role: admin_user,               tags: [base] }                      # create admin user with SSH access
    - { role: git_setup,                tags: [git] }                       # configure git settings and GitHub SSH key
    - { role: docker_setup,             tags: [docker] }                    # install and configure Docker with admin access

    # LXC only
    - { role: lxc_share_user,           tags: [storage], when: is_lxc }     # setup LXC shared folder access with proper GID mapping
    
    # VM only - alternative to lxc_share_user
    - { role: nfs_mounts,               tags: [storage], when: not is_lxc } # configure NFS mounts for media and server shares

    - { role: github_clone,             tags: [repos] }                     # clone GitHub repositories with SSH key authentication
    - { role: secrets_connect,          tags: [secrets] }                   # setup SSH connection to secrets server and decrypt secrets
        
    # Next role is for ANSIBLE machine only
    #- ansible_setup            # install and configure Ansible on the container
