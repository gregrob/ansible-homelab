---
# Backup Ansible Controller Keys and Vault Playbook
# Performs a local backup of controller SSH keys and Ansible Vault credentials,
# encrypts the archive with a gpg passphrase (AES256), then pushes the encrypted
# archive directly to the NAS.
#
# Usage:
#   ansible-playbook -i inventories/local/hosts.yaml playbooks/backup-ansible-controller.yaml --ask-vault-pass

- name: Backup Ansible Controller Keys and Vault
  hosts: ansible_target
  gather_facts: yes

  vars_files:
    - ../group_vars/all/vault.yaml
    - ../group_vars/all/nas.yaml

  roles:
    - { role: ansible_backup, tags: [backup] }
  