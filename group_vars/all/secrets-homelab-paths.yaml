---
# Shared path structure for the secrets-homelab repo
# Used by both secrets_connect and secrets_execute roles — define once here,
# not in each role's defaults, so there's a single source of truth.

# Root path where the secrets-homelab repo is checked out
secrets_homelab_path: /srv/secrets-homelab

# Server / client scripts subpaths
secrets_homelab_server_dir: "{{ secrets_homelab_path }}/server"
secrets_homelab_server_scripts_dir: "{{ secrets_homelab_server_dir }}/scripts"
secrets_homelab_server_secrets_dir: "{{ secrets_homelab_server_dir }}/secrets"

secrets_homelab_client_dir: "{{ secrets_homelab_path }}/client"
secrets_homelab_client_scripts_dir: "{{ secrets_homelab_client_dir }}/scripts"
